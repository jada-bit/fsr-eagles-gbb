<style>
:root{
  --bg:#08090b; --panel:#15161a; --panel2:#1d1f24; --line:#2c2f36; --ink:#f4f4f5; --muted:#a1a1aa;
  --gold:#FFB81C; --wood:#d9b083; --wood2:#cfa577; --courtline:#ffffff; --oob:#3a2c1e;
  --us:#1f3a8a; --pass:#0f172a; --red:#ef4444;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important} /* FIXED: hidden things stay hidden even when a style sets display */
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,sans-serif;line-height:1.45;touch-action:manipulation}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header h1{margin:0;font-size:clamp(2rem,6vw,3rem);font-weight:800;line-height:.95;font-style:italic;text-transform:uppercase}
header h1 span{color:var(--gold)}
header h1{display:flex;align-items:center;gap:10px}
header h1 .logo{height:1.1em;width:auto}
.hdr-link{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;text-decoration:none}
header p{margin:4px 0 0;color:var(--muted)}

.plays{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.play-btn{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;min-width:170px}
.play-btn[aria-pressed="true"]{border-color:var(--gold);background:#231c0b}
.play-btn b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;line-height:1.1}
.play-btn small{color:var(--muted)}
/* NEW: filters for a growing playbook */
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.filters input{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:.9rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#111}
.play-btn .ptags{display:block;font-size:.75rem;color:var(--muted);margin-top:2px}
.noresults{color:var(--muted);padding:10px 4px}
.reads{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.reads-q{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;color:var(--gold)}
.reads button{min-height:46px;border-radius:10px;border:1px solid var(--gold);background:#231c0b;color:var(--ink);font-weight:700;text-align:left;padding:8px 12px}
.reads button.keep{border-color:var(--line);background:var(--panel)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:99px;background:#3b2a07;color:var(--gold);margin-left:6px;vertical-align:2px}

.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:14px;align-items:start}
.court-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px}
svg.court{display:block;width:100%;height:auto;max-height:72vh;touch-action:manipulation}

.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{margin:0 0 2px;font-size:1.6rem;line-height:1.05}
.muted{color:var(--muted)}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:10px 8px;border-radius:9px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:#111}
.label{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 6px}
.spots{display:flex;gap:6px}
.spots button{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.25rem}
.spots button[aria-pressed="true"]{background:var(--gold);color:#111;border-color:var(--gold)}
.controls{display:flex;gap:8px;margin-top:12px}
.controls button{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:1rem}
.controls button.primary{background:var(--gold);color:#111;border-color:var(--gold)}
.controls button:disabled{opacity:.35;cursor:default}
.speed{display:flex;gap:6px;margin-top:8px}
.speed button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);font-weight:700}
.speed button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

.caption{background:var(--panel2);border-radius:12px;padding:12px 14px;margin-top:12px;min-height:92px}
.caption .stepno{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--gold);font-size:1rem}
.caption .say{font-size:1.1rem;margin-top:2px}
.caption .mine{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-weight:600}
.caption .mine::before{content:"Your job: ";color:var(--gold)}
.dots{display:flex;gap:6px;margin-top:10px}
.dots span{flex:1;height:5px;border-radius:99px;background:var(--line)}
.dots span.done{background:var(--gold)}
.dots span.now{background:#fff}

.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.9rem;color:var(--muted)}
.legend svg{width:38px;height:12px;vertical-align:middle;margin-right:6px}

#videoBox{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
#videoBox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#videoBox a{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700;font-size:1.1rem;text-decoration:underline}
.empty{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--muted)}
footer{margin-top:18px;color:var(--muted);font-size:.85rem}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  svg.court{max-height:none}
}
</style>
</head>

/* ---------- arrows ---------- */

const basePlay = () => PLAYS[playIdx];

/* ---------- render a frame ---------- */

  }
  const bx = holder != null ? pos[holder][0] + off : ballAt[0], by = holder != null ? pos[holder][1] - off : ballAt[1];
  if (shotLift) { br = 8 + 7 * shotLift; el('ellipse', { cx: bx + 4 + 10 * shotLift, cy: by + 6 + 14 * shotLift, rx: 7, ry: 3.5, fill: 'rgba(0,0,0,.2)' }, svg); }
  if (drib) el('ellipse', { cx: bx + 2, cy: by + 3, rx: br * .9, ry: br * .45, fill: 'rgba(0,0,0,.25)' }, svg);
  el('circle', { cx: bx, cy: by, r: br, fill: '#f97316', stroke: '#111', 'stroke-width': 1.5 }, svg);
}

/* ---------- captions ---------- */
function yourJob(step, p) {
  if (step.notes && step.notes[p]) return step.notes[p];
  const m = step.moves.find(x => involves(x, p));
  if (!m) return 'Hold your spot and stay ready.';
  if (m.type === 'pass') return m.from == p ? `Pass to ${m.to}.` : `Catch the pass from ${m.from}.`;
  return { cut: 'Cut to the spot shown.', dribble: 'Dribble to the spot shown.', screen: 'Set the screen shown.', shot: 'Shoot it.' }[m.type];
}
function updateCaption() {
  const p = basePlay(), play = vplay(), n = play.steps.length, step = play.steps[stepIdx];
  const opt = branch != null ? p.options[branch] : null;
  document.getElementById('stepNo').textContent = opt ? `${opt.name}: step ${stepIdx + 1} of ${n}` : (atEnd ? 'End of the play' : `Step ${stepIdx + 1} of ${n}`);
  document.getElementById('say').textContent = step.say || '';
  const mine = document.getElementById('mine');
  if (spot != null) { mine.hidden = false; mine.textContent = yourJob(step, spot); } else mine.hidden = true;
  document.getElementById('dots').innerHTML = play.steps.map((_, i) => `<span class="${i < stepIdx || atEnd ? 'done' : i === stepIdx ? 'now' : ''}"></span>`).join('');
  // reads
  const box = document.getElementById('reads'), here = optionsHere();
  if (here.length) {
    box.hidden = false;
    box.innerHTML = `<div class="reads-q">What's open?</div>` + here.map(({ o, i }) => `<button data-opt="${i}">${esc(o.name)}</button>`).join('') + (atEnd ? '' : `<button data-keep="1" class="keep">Keep running the play</button>`);
  } else if (opt && stepIdx === n - 1) {
    const others = (p.options || []).map((o, i) => ({ o, i })).filter(({ o, i }) => i !== branch && o.from === opt.from);
    box.hidden = false;
    box.innerHTML = `<button data-back="1" class="keep">Back to the play</button>` + (others.length ? `<div class="reads-q">Try another read</div>` + others.map(({ o, i }) => `<button data-opt="${i}">${esc(o.name)}</button>`).join('') : '');
  } else { box.hidden = true; box.innerHTML = ''; }
  box.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => chooseOption(+b.dataset.opt));
  const keep = box.querySelector('[data-keep]'); if (keep) keep.onclick = keepRunning;
  const back = box.querySelector('[data-back]'); if (back) back.onclick = backToPlay;
}
function chooseOption(i) {
  stopAnim(); playing = false; branch = i; atEnd = false; stepIdx = 0;
  updateCaption(); render(0, null); renderControls();
  if (mode === 'watch') watchFrom(0);
}
function backToPlay() {
  const p = basePlay(), o = p.options[branch];
  stopAnim(); playing = false; branch = null;
  if (o.from + 1 < p.steps.length) { stepIdx = o.from + 1; atEnd = false; } else { stepIdx = p.steps.length - 1; atEnd = true; }
  updateCaption(); render(stepIdx, atEnd ? 1 : null); renderControls();
}
function keepRunning() {
  document.getElementById('reads').hidden = true;
  if (mode === 'watch') watchFrom(stepIdx);
  else animateStep(stepIdx, () => stepForward());
}
function stepForward() {
  const n = vplay().steps.length;
  if (stepIdx < n - 1) { stepIdx++; } else if (branch == null) { atEnd = true; }
  updateCaption(); render(stepIdx, atEnd ? 1 : null); renderControls();
}

/* ---------- animation ---------- */
function stopAnim() { if (anim) cancelAnimationFrame(anim); anim = null; }
function animateStep(k, done) {
  stopAnim();
  const step = vplay().steps[k];
  const dur = (step.moves.length ? 1300 : 900) / speed;
  const t0 = performance.now();
  const tick = (now) => {
    const t = Math.min(1, (now - t0) / dur);
    render(k, step.moves.length ? t : null);
    if (t < 1) anim = requestAnimationFrame(tick); else { anim = null; done && done(); }
  };
  anim = requestAnimationFrame(tick);
}
function watchFrom(k) {
  playing = true; atEnd = false; stepIdx = k; updateCaption(); renderControls();
  document.getElementById('reads').hidden = true;
  const next = () => {
    if (!playing) return;
    setTimeout(() => {
      if (!playing) return;
      const n = vplay().steps.length;
      if (stepIdx < n - 1) {
        stepIdx++; updateCaption();
        if (optionsHere().length) { playing = false; render(stepIdx, null); renderControls(); return; } // pause to read
        animateStep(stepIdx, next);
      } else {
        playing = false; if (branch == null) atEnd = true;
        updateCaption(); render(stepIdx, atEnd ? 1 : null); renderControls();
      }
    }, 650 / speed);
  };
  setTimeout(() => playing && animateStep(stepIdx, next), 450 / speed);
}

/* ---------- controls ---------- */
function renderControls() {
  const c = document.getElementById('controls'), n = vplay().steps.length;
  const endReads = branch == null && (basePlay().options || []).some(o => o.from === basePlay().steps.length - 1);
  document.getElementById('speedRow').style.display = '';
  const restart = () => { playing = false; stopAnim(); branch = null; atEnd = false; stepIdx = 0; updateCaption(); render(0, null); renderControls(); };
  if (mode === 'watch') {
    const finished = atEnd || (!playing && stepIdx >= n - 1 && branch != null);
    c.innerHTML = `<button class="primary" id="playBtn">${playing ? 'Pause' : (atEnd ? 'Watch again' : (optionsHere().length ? 'Keep running' : (finished ? 'Watch again' : 'Play')))}</button><button id="restartBtn">Restart</button>`;
    document.getElementById('playBtn').onclick = () => {
      if (playing) { playing = false; stopAnim(); render(stepIdx, null); renderControls(); }
      else if (atEnd) restart(), watchFrom(0);
      else if (finished) watchFrom(0);
      else watchFrom(stepIdx);
    };
    document.getElementById('restartBtn').onclick = restart;
  } else {
    const last = stepIdx >= n - 1;
    const nextLabel = last && endReads && !atEnd ? 'Finish' : 'Next';
    c.innerHTML = `<button id="backBtn" ${stepIdx === 0 && !atEnd ? 'disabled' : ''}>Back</button><button id="showBtn">Show it</button><button class="primary" id="nextBtn" ${(last && !(endReads && !atEnd)) ? 'disabled' : ''}>${nextLabel}</button>`;
    document.getElementById('backBtn').onclick = () => { stopAnim(); if (atEnd) atEnd = false; else stepIdx--; updateCaption(); render(stepIdx, null); renderControls(); };
    document.getElementById('showBtn').onclick = () => animateStep(stepIdx, () => setTimeout(() => render(stepIdx, atEnd ? 1 : null), 500));
    document.getElementById('nextBtn').onclick = () => animateStep(stepIdx, stepForward);
  }
}
function videoEmbed(url) {
  if (!url) return null;
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{6,})/);
  if (m) return `https://www.youtube-nocookie.com/embed/${m[1]}`;
  m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  return null;
}
function showVideo(on) {
  const play = PLAYS[playIdx], box = document.getElementById('videoBox');
  document.getElementById('court').hidden = on; box.hidden = !on;
  document.getElementById('diagramOnly').hidden = on;
  bar.hidden = on;
  if (!on) { box.innerHTML = ''; return; }
  const src = videoEmbed(play.video);
  box.innerHTML = src ? `<iframe src="${esc(src)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Play video"></iframe>`
                      : `<a href="${esc(play.video)}" target="_blank" rel="noopener">Open the video</a>`;
}
function setMode(m) {
  mode = m; playing = false; stopAnim(); branch = null; atEnd = false;
  document.getElementById('modeWatch').setAttribute('aria-pressed', m === 'watch');
  document.getElementById('modeStep').setAttribute('aria-pressed', m === 'step');
  document.getElementById('modeVideo').setAttribute('aria-pressed', m === 'video');
  showVideo(m === 'video');
  if (m === 'video') return;
  stepIdx = 0; updateCaption(); render(0, null); renderControls();
}
function selectPlay(i) {
  playIdx = i; playing = false; stopAnim(); stepIdx = 0; branch = null; atEnd = false;
  const play = PLAYS[i];
  document.getElementById('modeVideo').hidden = !play.video;
  if (mode === 'video' && !play.video) mode = 'watch';
  document.getElementById('modeWatch').setAttribute('aria-pressed', mode === 'watch');
  document.getElementById('modeStep').setAttribute('aria-pressed', mode === 'step');
  document.getElementById('modeVideo').setAttribute('aria-pressed', mode === 'video');
  showVideo(mode === 'video');
  document.querySelectorAll('.play-btn').forEach(b => { const on = +b.dataset.i === i; b.setAttribute('aria-pressed', on); if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
  document.getElementById('playName').textContent = play.name;
  document.getElementById('to3d').href = `playbook-3d.html?play=${encodeURIComponent(play.name || '')}${TEST_MODE ? '&test' : ''}`;
  document.getElementById('playSummary').textContent = play.summary || '';
  updateCaption(); render(0, null); renderControls();
}

/* ---------- build UI ---------- */
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// NEW: search, type, and tag filters. They appear once there are more than a few plays.
let fText = '', fCat = 'All', fTags = new Set();
// CHANGED: "Man-to-man" and "Man-to-Man" count as the same tag
const tagKey = (t) => String(t || '').trim().replace(/\s+/g, ' ').toLowerCase();
const matches = (p) => {
  const hay = [p.name, p.category, p.summary, ...(p.tags || [])].join(' ').toLowerCase();
  return (!fText || hay.includes(fText)) && (fCat === 'All' || p.category === fCat) && [...fTags].every(t => (p.tags || []).some(x => tagKey(x) === tagKey(t)));
};
function buildFilters() {
  const box = document.getElementById('filters');
  box.hidden = PLAYS.length <= 4;
  const cats = ['All', ...new Set(PLAYS.map(p => p.category).filter(Boolean))];
  const seen = new Map(); PLAYS.flatMap(p => p.tags || []).forEach(t => { const k = tagKey(t); if (k && !seen.has(k)) seen.set(k, String(t).trim()); });
  const tags = [...seen.values()].sort((a, b) => a.localeCompare(b));
  if (!cats.includes(fCat)) fCat = 'All';
  fTags = new Set([...fTags].filter(t => tags.includes(t)));
  document.getElementById('catChips').innerHTML = cats.length > 2 ? cats.map(c => `<button class="chip" data-c="${esc(c)}" aria-pressed="${c === fCat}">${esc(c)}</button>`).join('') : '';
  document.getElementById('tagChips').innerHTML = tags.map(t => `<button class="chip" data-t="${esc(t)}" aria-pressed="${fTags.has(t)}">${esc(t)}</button>`).join('');
  // NEW: tags fold away behind one button so a big playbook doesn't push the court off the screen
  const tg = document.getElementById('tagToggle');
  tg.hidden = !tags.length; tg.textContent = fTags.size ? `Tags (${fTags.size} on)` : 'Tags';
  tg.setAttribute('aria-pressed', fTags.size > 0);
  tg.onclick = () => { const box = document.getElementById('tagChips'); box.hidden = !box.hidden; tg.setAttribute('aria-expanded', !box.hidden); };
  document.querySelectorAll('#catChips .chip').forEach(b => b.onclick = () => { fCat = b.dataset.c; buildFilters(); buildPlayList(true); });
  document.querySelectorAll('#tagChips .chip').forEach(b => b.onclick = () => { const t = b.dataset.t; fTags.has(t) ? fTags.delete(t) : fTags.add(t); buildFilters(); buildPlayList(true); });
}
document.getElementById('search').addEventListener('input', e => { fText = e.target.value.trim().toLowerCase(); buildPlayList(true); });
function buildPlayList(keepSelection) {
  const shown = PLAYS.map((p, i) => [p, i]).filter(([p]) => matches(p));
  document.getElementById('plays').innerHTML = shown.length ? shown.map(([p, i]) =>
    `<button class="play-btn" aria-pressed="${i === playIdx}" data-i="${i}"><b>${esc(p.name)}${p.sample ? '<span class="tag">Sample</span>' : ''}</b><small>${esc(p.category)}${(p.options || []).length ? ` • ${p.options.length} read${p.options.length === 1 ? '' : 's'}` : ''}</small>${(p.tags || []).length ? `<span class="ptags">${esc(p.tags.join(' • '))}</span>` : ''}</button>`).join('')
    : '<div class="noresults">No plays match. Clear a filter to see more.</div>';
  document.querySelectorAll('.play-btn').forEach(b => b.onclick = () => selectPlay(+b.dataset.i));
  if (keepSelection && shown.length && !shown.some(([, i]) => i === playIdx)) selectPlay(shown[0][1]);
}
buildFilters();
buildPlayList();

document.getElementById('spots').innerHTML = ['All', 1, 2, 3, 4, 5].map(s => `<button data-s="${s}" aria-pressed="${s === 'All'}">${s}</button>`).join('');
document.querySelectorAll('#spots button').forEach(b => b.onclick = () => {
  spot = b.dataset.s === 'All' ? null : +b.dataset.s;
  document.querySelectorAll('#spots button').forEach(x => x.setAttribute('aria-pressed', x === b));
  updateCaption(); if (!anim) render(stepIdx, null);
});
document.querySelectorAll('#speedRow button').forEach(b => b.onclick = () => {
  speed = +b.dataset.speed;
  document.querySelectorAll('#speedRow button').forEach(x => x.setAttribute('aria-pressed', x === b));
});
// NEW: on phones, the play controls and the step text sit right under the court, so players can
// read each step while it plays instead of scrolling back and forth.
const bar = document.getElementById('bar'), mq = window.matchMedia('(max-width:820px)');
function placeBar() { (mq.matches ? document.getElementById('barMobile') : document.getElementById('barHome')).appendChild(bar); if (!anim) render(stepIdx, atEnd ? 1 : null); }
if (mq.addEventListener) mq.addEventListener('change', placeBar); else mq.addListener(placeBar);
document.getElementById('modeWatch').onclick = () => setMode('watch');
document.getElementById('modeStep').onclick = () => setMode('step');
document.getElementById('modeVideo').onclick = () => setMode('video');

const startIndex = () => { const want = new URLSearchParams(location.search).get('play'); const i = want ? PLAYS.findIndex(p => p.name === want) : -1; return i < 0 ? 0 : i; };
placeBar();
selectPlay(startIndex());

// Load published plays (read-only). Falls back to the samples if none are published or offline.
try {
  if (window.firebase) {
    if (!firebase.apps.length) firebase.initializeApp({ apiKey: "AIzaSyA5H5SsumWG7bym_0EZ7jOlfWeswpSauhk", authDomain: "eagles-stats.firebaseapp.com", projectId: "eagles-stats", appId: "1:386723096734:web:b50e343c703983e838b38f" });
    firebase.firestore().collection(TEST_MODE ? 'test_plays' : 'plays').where('published', '==', true).onSnapshot(snap => {
      const live = snap.docs.map(d => d.data()).filter(p => p.start && Array.isArray(p.steps) && p.steps.length)
        .sort((a, b) => (a.category || '').localeCompare(b.category || '') || (a.name || '').localeCompare(b.name || ''));
      PLAYS = live.length ? live : SAMPLE_PLAYS;
      playIdx = startIndex(); buildFilters(); buildPlayList(); selectPlay(playIdx);
    }, () => {});
  }
} catch (e) { /* offline: keep the samples */ }
</script>
