<style>
/* CHANGED: always dark, matching the 2D playbook and the stats app */
:root{
  --bg:#08090b; --panel:#15161a; --panel2:#1d1f24; --line:#2c2f36; --ink:#f4f4f5; --muted:#a1a1aa; --gold:#FFB81C; --on-gold:#111;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important} /* FIXED: hidden things stay hidden even when a style sets display */
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,sans-serif;line-height:1.45;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header h1{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800;font-style:italic;text-transform:uppercase;line-height:.95;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1 span.gold{color:var(--gold)}
header h1 .logo{height:1.15em;width:auto}
header p{margin:6px 0 0;color:var(--muted)}
.hdr-link{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;text-decoration:none}
.tag{display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:99px;background:#3b2a07;color:var(--gold);font-style:normal;margin-left:6px;vertical-align:2px}
.plays{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.play-btn{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;min-width:170px}
.play-btn[aria-pressed="true"]{border-color:var(--gold);background:#231c0b}
.play-btn b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;line-height:1.1}
.play-btn small{color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:14px;align-items:start}
.stage{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage .hint{position:absolute;left:10px;bottom:10px;right:10px;width:fit-content;background:rgba(0,0,0,.6);color:#fff;font-size:.85rem;padding:5px 9px;border-radius:8px;pointer-events:none}
.stage .err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;line-height:1.05}
.muted{color:var(--muted)}
.label{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 6px}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:9px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.1rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.spots{display:flex;gap:6px}
.spots button{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.25rem}
.spots button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.controls{display:flex;gap:8px;margin-top:12px}
.controls button{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:1rem}
.controls button.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.controls button:disabled{opacity:.35;cursor:default}
.speed{display:flex;gap:6px;margin-top:8px}
.speed button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);font-weight:700}
.speed button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.caption{background:var(--panel2);border-radius:12px;padding:12px 14px;margin-top:12px;min-height:92px}
.caption .stepno{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--gold);font-size:1rem}
.caption .say{font-size:1.1rem;margin-top:2px}
.caption .mine{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-weight:600}
.caption .mine::before{content:"Your job: ";color:var(--gold)}
.dots{display:flex;gap:6px;margin-top:10px}
.dots span{flex:1;height:5px;border-radius:99px;background:var(--line)}
.dots span.done{background:var(--gold)}
.dots span.now{background:#fff}
.reads{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.reads-q{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;color:var(--gold)}
.reads button{min-height:46px;border-radius:10px;border:1px solid var(--gold);background:#231c0b;color:var(--ink);font-weight:700;text-align:left;padding:8px 12px}
.reads button.keep{border-color:var(--line);background:var(--panel)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.9rem;color:var(--muted)}
.legend svg{width:38px;height:12px;vertical-align:middle;margin-right:6px}
#barMobile .caption{margin-top:10px}
footer{margin-top:18px;color:var(--muted);font-size:.85rem}
/* NEW: "What number are you?" right at the top, so kids see their own player first */
.picker{display:flex;align-items:center;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.picker .q{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.25rem;margin-right:4px}
.picker button{min-width:46px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.35rem}
.picker button.all{font-size:1rem;padding:0 12px}
.picker button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
/* NEW: short labels painted over the court, so nobody has to read a sentence while watching */
.court-cap{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.court-cap .what{background:rgba(0,0,0,.75);color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.35rem;line-height:1.1;padding:4px 10px;border-radius:8px;text-transform:uppercase}
.court-cap .job{background:var(--gold);color:#111;font-weight:800;font-size:1.05rem;line-height:1.2;padding:4px 10px;border-radius:8px;max-width:100%}
/* NEW: quiz mode */
.quiz{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.quiz .qq{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.35rem;color:var(--gold);line-height:1.1}
.quiz .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.quiz button{min-height:48px;border-radius:10px;border:1px solid var(--gold);background:#231c0b;color:var(--ink);font-weight:800;font-size:1.05rem;padding:8px 12px}
.quiz .fb{font-weight:800;font-size:1.15rem}
.quiz .fb.ok{color:#4ade80} .quiz .fb.no{color:#f87171}
.quiz .score{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:2.6rem;line-height:1;color:var(--gold)}
.quiz .tapnote{color:var(--muted)}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  /* NEW: keep the court on screen while the play runs and the buttons below it scroll */
  .layout > .col-stage{display:contents}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
}
</style>
</head>

    c.innerHTML = `<button class="primary" id="playBtn">${label}</button><button id="restartBtn">Restart</button>`;
    document.getElementById('playBtn').onclick = () => {
      if (playing) playing = false;
      else if (finished()) { restart(); playing = true; pauseLeft = 0.3; }
      else { playing = true; document.getElementById('reads').hidden = true; }
      renderControls(); wake();
    };
    document.getElementById('restartBtn').onclick = () => { restart(); renderControls(); };
  } else {
    const endReads = branch == null && (PLAY.options || []).some(o => o.from === PLAY.steps.length - 1);
    const lastStep = k >= n - 1;
    const nextLabel = lastStep && endReads && !atEnd ? 'Finish' : 'Next';
    const nextOff = atEnd || (lastStep && !(endReads && !atEnd));
    c.innerHTML = `<button id="backBtn" ${k === 0 && !atEnd ? 'disabled' : ''}>Back</button><button id="showBtn" ${atEnd ? 'disabled' : ''}>Show it</button><button class="primary" id="nextBtn" ${nextOff ? 'disabled' : ''}>${nextLabel}</button>`;
    document.getElementById('backBtn').onclick = () => { playing = false; after = null; if (atEnd) { atEnd = false; t = 0; } else if (k > 0) { k--; t = 0; } showPaths(k); caption(); renderControls(); };
    document.getElementById('showBtn').onclick = () => { t = 0; pauseLeft = 0; after = 'show'; playing = true; wake(); };
    document.getElementById('nextBtn').onclick = () => { t = 0; pauseLeft = 0; after = 'next'; playing = true; wake(); };
  }
}
const setPressed = (id, on) => document.getElementById(id).setAttribute('aria-pressed', on);
function setMode(m) {
  mode = m; setPressed('modeWatch', m === 'watch'); setPressed('modeStep', m === 'step'); setPressed('modeQuiz', m === 'quiz');
  if (m === 'quiz') { startQuiz(); return; }
  quiz = null; restart(); renderControls();
}
document.getElementById('modeWatch').onclick = () => setMode('watch');
document.getElementById('modeStep').onclick = () => setMode('step');
document.getElementById('modeQuiz').onclick = () => setMode('quiz');

function updateHint() {
  const h = document.getElementById('hint');
  h.textContent = view === 'first' ? `You are ${meNum()}. The camera follows the ball.`
    : (spot == null ? 'Drag to turn. Pinch to zoom.' : `You are ${spot} (gold). Tap First person to see it from your spot.`);
  h.style.display = '';
}
const spots = document.getElementById('spots');
spots.innerHTML = ['All', 1, 2, 3, 4, 5].map(p => `<button data-p="${p}" aria-pressed="${p === 'All'}">${p}</button>`).join('');
// NEW: the big picker at the top. Same buttons, kept in sync with "My spot" below.
const picker = document.getElementById('picker');
picker.insertAdjacentHTML('beforeend', [1, 2, 3, 4, 5].map(p => `<button data-p="${p}" aria-pressed="false">${p}</button>`).join('') + `<button class="all" data-p="All" aria-pressed="true">Just watch</button>`);
function setSpot(s) {
  spot = s;
  try { localStorage.setItem('eagles3d_spot', s == null ? '' : String(s)); } catch (e) {}
  document.querySelectorAll('#spots button, #picker button').forEach(x => x.setAttribute('aria-pressed', x.dataset.p === (s == null ? 'All' : String(s))));
  if (s == null && view === 'first') setView('broadcast');
  if (view === 'first') camera.position.copy(W(...frame(k, t).pos[meNum()], 5.4));
  if (mode === 'quiz') { startQuiz(); updateHint(); return; }
  showPaths(k); caption(); updateHint(); // FIXED: the hint now updates when switching players in first person
}
document.querySelectorAll('#spots button, #picker button').forEach(b => b.onclick = () => setSpot(b.dataset.p === 'All' ? null : +b.dataset.p));
function setView(v) {
  if (v === 'first' && mode === 'quiz') setMode('watch');
  if (v === 'first' && spot == null) { view = v; setSpot(1); }
  view = v;
  setPressed('viewBroadcast', v === 'broadcast'); setPressed('viewFirst', v === 'first');
  camera.fov = v === 'first' ? 70 : 55; camera.updateProjectionMatrix();
  if (v === 'first') camera.position.copy(W(...frame(k, t).pos[meNum()], 5.4));
  updateHint(); wake();
}
document.getElementById('viewBroadcast').onclick = () => setView('broadcast');
document.getElementById('viewFirst').onclick = () => setView('first');
document.getElementById('slowBtn').onclick = () => { speed = 0.5; setPressed('slowBtn', true); setPressed('normalBtn', false); };
document.getElementById('normalBtn').onclick = () => { speed = 1; setPressed('slowBtn', false); setPressed('normalBtn', true); };

// NEW: on phones the play controls and step text sit right under the 3D view
const bar = document.getElementById('bar'), mq = window.matchMedia('(max-width:820px)');
const placeBar = () => (mq.matches ? document.getElementById('barMobile') : document.getElementById('barHome')).appendChild(bar);
if (mq.addEventListener) mq.addEventListener('change', placeBar); else mq.addListener(placeBar);
placeBar();

function selectPlay(i) {
  PLAY = PLAYS[i]; branch = null; atEnd = false; makeView(); k = 0; t = 0; playing = false; pauseLeft = 0; after = null; lookNow.set(0, 5, 5);
  document.getElementById('playName').textContent = PLAY.name || 'Play';
  document.getElementById('playSummary').textContent = PLAY.summary || '';
  document.querySelectorAll('.play-btn').forEach(b => { const on = +b.dataset.i === i; b.setAttribute('aria-pressed', on); if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
  document.getElementById('to2d').href = `playbook.html?play=${encodeURIComponent(PLAY.name || '')}${TEST_MODE ? '&test' : ''}`;
  if (mode === 'quiz' && quiz) { startQuiz(); return; }
  caption(); showPaths(0); renderControls();
}
// CHANGED: tappable play cards, the same as the 2D playbook
function buildPlayList() {
  const nav = document.getElementById('plays');
  nav.innerHTML = PLAYS.map((p, i) => `<button class="play-btn" data-i="${i}" aria-pressed="false"><b>${esc3(p.name || 'Play')}${p.sample ? '<span class="tag">Sample</span>' : ''}</b><small>${esc3(p.category || '')}${(p.options || []).length ? ` • ${p.options.length} read${p.options.length === 1 ? '' : 's'}` : ''}</small></button>`).join('');
  nav.querySelectorAll('.play-btn').forEach(b => b.onclick = () => selectPlay(+b.dataset.i));
}
const startIndex = () => { const i = WANT_PLAY ? PLAYS.findIndex(p => p.name === WANT_PLAY) : -1; return i < 0 ? 0 : i; };
buildPlayList();
resize(); if (stage.clientWidth < 560) orbit.r = 40; // a little closer on phones so players are easier to see
selectPlay(startIndex()); requestAnimationFrame(loop);
// NEW: links like playbook-3d.html?play=Box&spot=3&mode=quiz open straight to that number (and the quiz).
// Without ?spot, the number this phone picked last time is used.
(function () {
  let s = params.get('spot');
  if (s == null) { try { s = localStorage.getItem('eagles3d_spot'); } catch (e) {} }
  if (s && /^[1-5]$/.test(s)) setSpot(+s);
  const m = params.get('mode'); if (m === 'quiz' || m === 'step') setMode(m);
})();

// Load published plays from the play builder. Add ?test to the address for test-mode plays.
try {
  if (window.firebase) {
    if (!firebase.apps.length) firebase.initializeApp({ apiKey: "AIzaSyA5H5SsumWG7bym_0EZ7jOlfWeswpSauhk", authDomain: "eagles-stats.firebaseapp.com", projectId: "eagles-stats", appId: "1:386723096734:web:b50e343c703983e838b38f" });
    firebase.firestore().collection(TEST_MODE ? 'test_plays' : 'plays').where('published', '==', true).onSnapshot(snap => {
      const live = snap.docs.map(d => d.data()).filter(p => p.start && Array.isArray(p.steps) && p.steps.length && [1, 2, 3, 4, 5].every(n => p.start[n]))
        .sort((a, b) => (a.category || '').localeCompare(b.category || '') || (a.name || '').localeCompare(b.name || ''));
      PLAYS = live.length ? live : [GIVE_AND_GO];
      buildPlayList(); selectPlay(startIndex()); if (mode === 'quiz') startQuiz();
    }, () => {});
  }
} catch (e) { /* offline or blocked: keep the sample */ }
})();
</script>
