            const onCourtTap = (pt) => {
                if (actor == null) return;
                if (isSetup) { change(d => { d.start[actor] = pt; }); return; }
                if (tool === 'pass') return;
                change(d => { S(d)[k].moves = (S(d)[k].moves || []).filter(m => m.type === 'pass' || m.p !== actor); S(d)[k].moves.push({ p: actor, type: tool, to: pt }); });
                setActor(null);
            };

            // NEW: drag a player in Setup to place them, or drag from a player to draw a curved path.
            const onDragDone = (p, pts) => {
                const end = pts[pts.length - 1].map(Math.round);
                if (isSetup) { change(d => { d.start[p] = end; }); setActor(null); return; }
                if (tool === 'pass') return;
                change(d => { S(d)[k].moves = (S(d)[k].moves || []).filter(m => m.type === 'pass' || m.p !== p); S(d)[k].moves.push({ p, type: tool, to: end }); });
                setActor(null);
            };
            const dragMode = anim ? null : (isSetup ? 'place' : (tool === 'pass' || tool === 'shot' ? null : 'path'));
            // NEW: drag the gold dot on a line to bend it. Dropping it back on the line straightens it.
            const onBend = (i, pt) => change(d => {
                const m = S(d)[k].moves[i]; if (!m || m.type === 'pass' || m.type === 'shot') return;
                const a = pbStateAt(vpOf(d), k).pos[m.p], mid = [(a[0] + m.to[0]) / 2, (a[1] + m.to[1]) / 2];
                delete m.path;
                if (Math.hypot(pt[0] - mid[0], pt[1] - mid[1]) < 10) delete m.bend; else m.bend = { x: Math.round(pt[0]), y: Math.round(pt[1]) };
            });

            const addTag = (raw) => {
                const typed = (raw || '').trim().replace(/\s+/g, ' ');
                if (!typed) return;
                const t = allTags.find(x => tagKey(x) === tagKey(typed)) || typed; // reuse the existing spelling
                change(d => { d.tags = d.tags || []; if (!d.tags.some(x => x.toLowerCase() === t.toLowerCase())) d.tags.push(t); });
                setTagInput('');
            };
            const addStep = () => { change(d => { S(d).push({ say: '', moves: [], notes: {} }); }); setK(vp.steps.length); setActor(null); };
            const delStep = () => {
                if (ctx == null && k === 0) return;
                if (ctx != null && vp.steps.length <= 1) return showToast("A read needs at least one step. Delete the read instead.", "error");
                change(d => {
                    S(d).splice(k, 1);
                    if (ctx == null) (d.options || []).forEach(o => { if (o.from >= k) o.from = Math.max(0, o.from - 1); });
                });
                setK(Math.max(0, k - 1));
            };
            const moveStep = (dir) => {
                const j = k + dir, min = ctx == null ? 1 : 0;
                if ((ctx == null && k === 0) || j < min || j >= vp.steps.length) return;
                change(d => {
                    const st = S(d), tmp = st[k]; st[k] = st[j]; st[j] = tmp;
                    if (ctx == null) (d.options || []).forEach(o => { if (o.from === k) o.from = j; else if (o.from === j) o.from = k; });
                });
                setK(j);
            };
            const addOption = () => {
                const n = (draft.options || []).length;
                change(d => { d.options = d.options || []; d.options.push({ name: `Read ${n + 1}`, from: k, steps: [{ say: '', moves: [], notes: {} }] }); });
                setCtx(n); setK(0); setActor(null);
            };
            const deleteOption = async () => {
                if (!(await uiConfirm(`Delete "${draft.options[ctx].name}"?`))) return;
                const from = draft.options[ctx].from;
                change(d => { d.options.splice(ctx, 1); });
                setCtx(null); setK(from); setActor(null);
            };

            const preview = () => {
                if (rafRef.current) cancelAnimationFrame(rafRef.current);
                const n = vp.steps.length; let kk = ctx == null ? 1 : 0, t0 = null;
                if (n < (ctx == null ? 2 : 1)) return showToast("Add a step to preview the play", "error");
                const tick = (now) => {
                    if (t0 == null) t0 = now;
                    const t = Math.min(1, (now - t0) / 1300);
                    setAnim({ k: kk, t });
                    if (t >= 1) { if (kk < n - 1) { kk++; t0 = now + 500; } else { setTimeout(() => setAnim(null), 800); return; } }
                    rafRef.current = requestAnimationFrame(tick);
                };
                rafRef.current = requestAnimationFrame(tick);
            };

            const hint = isSetup
                ? (actor == null ? 'Drag each player to their starting spot (or tap a player, then tap the spot).' : `Now tap where ${actor} starts.`)
                : tool === 'shot' ? 'Tap the player who shoots.'
                : tool === 'pass'
                    ? (actor == null ? 'Tap the player passing the ball.' : `Now tap the player ${actor} passes to.`)
                    : (actor == null ? `Drag a player to where they ${tool === 'screen' ? 'set the screen' : 'go'} (or tap the player, then the spot). To curve it, drag the gold dot on the line.` : `Now tap where ${actor} ${tool === 'screen' ? 'sets the screen' : 'goes'}.`);

            if (!draft) return (
                <div className="space-y-4 animate-slideIn max-w-4xl mx-auto">
                    <div className="flex flex-col md:flex-row md:items-end justify-between gap-3">
                        <div>
                            <h2 className="text-2xl font-black uppercase">Playbook</h2>
                            <p className="text-sm text-zinc-400">Build plays here. Published plays show up for players on the playbook page. Drafts stay hidden.</p>
                        </div>
                        <div className="flex gap-2">
                            <a href={TEST_MODE ? 'playbook.html?test' : 'playbook.html'} target="_blank" rel="noopener" className="py-2 px-4 bg-zinc-800 hover:bg-zinc-700 rounded font-black uppercase text-xs">Open player view</a>
                            <button onClick={exportPlays} className="py-2 px-4 bg-zinc-800 hover:bg-zinc-700 rounded font-black uppercase text-xs">Export plays</button>
                            <label className="py-2 px-4 bg-zinc-800 hover:bg-zinc-700 rounded font-black uppercase text-xs cursor-pointer">Import plays<input type="file" accept=".json,application/json" onChange={importPlays} className="hidden" /></label>
                            <button onClick={() => open(pbNewPlay())} className="py-2 px-4 bg-gold text-black rounded font-black uppercase text-xs">+ New play</button>
                        </div>
                    </div>
                    {plays.length > 0 && (
                        <div className="bento-card space-y-2">
                            <div className="flex flex-col md:flex-row gap-2">
                                <input className="flex-1 bg-black border border-zinc-700 p-2 rounded text-white text-sm" placeholder="Search plays" value={fText} onChange={e => setFText(e.target.value)} />
                                <select className="bg-black border border-zinc-700 p-2 rounded text-white text-sm" value={fCat} onChange={e => setFCat(e.target.value)}>
                                    <option>All</option>{PLAY_CATEGORIES.map(c => <option key={c}>{c}</option>)}
                                </select>
                                <select className="bg-black border border-zinc-700 p-2 rounded text-white text-sm" value={fStatus} onChange={e => setFStatus(e.target.value)}>
                                    <option>All</option><option>Published</option><option>Drafts</option>
                                </select>
                            </div>
                            {allTags.length > 0 && (
                                <div className="flex flex-wrap gap-1">
                                    {allTags.map(t => <button key={t} onClick={() => setFTags(f => f.includes(t) ? f.filter(x => x !== t) : [...f, t])} className={`nav-btn ${fTags.includes(t) ? 'active-nav' : 'inactive-nav'}`} style={{ padding: '6px 10px' }}>{t}</button>)}
                                </div>
                            )}
                            <div className="text-xs text-zinc-500">{shownPlays.length} of {plays.length} plays</div>
                        </div>
                    )}
                    {plays.length === 0 && <div className="bento-card text-center text-zinc-400 py-10">No plays yet. Tap <b>New play</b> to build the first one. Until you publish one, players see the two sample plays.</div>}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {shownPlays.map(p => (
                            <button key={p.id} onClick={() => open(p)} className="bento-card text-left hover:border-gold">
                                <div className="flex justify-between items-start gap-2">
                                    <div><div className="font-black text-lg">{p.name}</div><div className="text-xs text-zinc-400">{p.category} • {(p.steps || []).length} steps{p.video ? ' • video' : ''}</div>{(p.tags || []).length > 0 && <div className="text-[11px] text-zinc-500 mt-1">{p.tags.join(' • ')}</div>}</div>
                                    <span className={`text-[10px] font-black uppercase px-2 py-1 rounded-full border ${p.published ? 'border-green-600 text-green-300' : 'border-zinc-600 text-zinc-400'}`}>{p.published ? 'Published' : (p.imported ? 'Imported draft' : 'Draft')}</span>
                                </div>
                            </button>
                        ))}
                    </div>
                </div>
            );

            const step = vp.steps[k] || { moves: [] };
            return (
                <div className="space-y-4 animate-slideIn">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                        <button onClick={close} className="text-sm text-zinc-400 underline"><Icon name="arrowLeft" className="mr-1" />All plays</button>
                        <div className="flex gap-2 flex-wrap">
                            <label className="flex items-center gap-2 text-sm bg-zinc-900 border border-zinc-700 rounded px-3 py-2"><input type="checkbox" checked={!!draft.published} onChange={e => change(d => { d.published = e.target.checked; })} /> Published (players can see it)</label>
                            <button onClick={preview} className="py-2 px-4 bg-zinc-800 rounded font-black uppercase text-xs"><Icon name="play" className="mr-1.5" />Preview</button>
                            <button onClick={save} className="py-2 px-4 bg-gold text-black rounded font-black uppercase text-xs">{dirty ? 'Save play' : 'Saved'}</button>
                            <button onClick={remove} className="py-2 px-3 text-red-400 text-xs underline">Delete</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                        <div className="lg:col-span-7 bento-card">
                            <div className="text-sm font-bold text-gold mb-2 min-h-[1.25rem]">{anim ? `Previewing step ${anim.k + 1}` : hint}</div>
                            <PlayCourtSVG play={vp} k={anim ? anim.k : k} t={anim ? anim.t : null} selected={anim ? null : actor} onCourtTap={anim ? null : onCourtTap} onPlayerTap={anim ? null : onPlayerTap} dragMode={dragMode} onDragDone={onDragDone} onBend={anim || isSetup ? null : onBend} />
                        </div>

                        <div className="lg:col-span-5 space-y-3">
                            <div className="bento-card space-y-2">
                                <input className="w-full bg-black border border-zinc-700 p-2 rounded text-white font-bold" placeholder="Play name" value={draft.name} onChange={e => change(d => { d.name = e.target.value; })} />
                                <select className="w-full bg-black border border-zinc-700 p-2 rounded text-white text-sm" value={draft.category} onChange={e => change(d => { d.category = e.target.value; })}>{PLAY_CATEGORIES.map(c => <option key={c}>{c}</option>)}</select>
                                <div className="space-y-1">
                                    <div className="flex flex-wrap gap-1">
                                        {(draft.tags || []).map(t => <span key={t} className="text-xs bg-gold text-black font-bold rounded-full pl-2 pr-1 py-0.5 flex items-center gap-1">{t}<button onClick={() => change(d => { d.tags = (d.tags || []).filter(x => x !== t); })} className="px-1"><Icon name="close" /></button></span>)}
                                    </div>
                                    <input className="w-full bg-black border border-zinc-700 p-2 rounded text-white text-sm" placeholder="Add a tag and press Enter (for example, Man-to-man)" value={tagInput} onChange={e => { const v = e.target.value; if (v.includes(',')) { v.split(',').forEach(addTag); } else setTagInput(v); }} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addTag(tagInput); } }} />
                                    <div className="flex flex-wrap gap-1">
                                        {uniqTags([...allTags, ...PB_TAG_SUGGESTIONS]).filter(t => !hasTag(draft.tags, t)).slice(0, 14).map(t => <button key={t} onClick={() => addTag(t)} className="text-[11px] border border-zinc-700 text-zinc-400 rounded-full px-2 py-0.5 hover:border-gold">+ {t}</button>)}
                                    </div>
                                </div>
                                <textarea rows="2" className="w-full bg-black border border-zinc-700 p-2 rounded text-white text-sm" placeholder="One-line summary (when we run it)" value={draft.summary} onChange={e => change(d => { d.summary = e.target.value; })} />
                                <input className="w-full bg-black border border-zinc-700 p-2 rounded text-white text-sm" placeholder="Video link (optional: unlisted YouTube or Google Drive)" value={draft.video || ''} onChange={e => change(d => { d.video = e.target.value.trim(); })} />
                            </div>

                            <div className="bento-card space-y-3">
                                {/* NEW: switch between the main play and its reads */}
                                <div className="flex flex-wrap gap-1 items-center border-b border-zinc-800 pb-2">
                                    <button onClick={() => { setCtx(null); setK(0); setActor(null); }} className={`nav-btn ${ctx == null ? 'active-nav' : 'inactive-nav'}`}>Main play</button>
                                    {(draft.options || []).map((o, i) => (
                                        <button key={i} onClick={() => { setCtx(i); setK(0); setActor(null); }} className={`nav-btn ${ctx === i ? 'active-nav' : 'inactive-nav'}`}><Icon name="branch" className="mr-1" />{o.name || `Read ${i + 1}`}</button>
                                    ))}
                                    {ctx == null && <button onClick={addOption} className="nav-btn inactive-nav">+ Add read after {k === 0 ? 'setup' : `step ${k + 1}`}</button>}
                                </div>
                                {ctx != null && (
                                    <div className="space-y-1">
                                        <input className="w-full bg-black border border-zinc-700 p-2 rounded text-white font-bold text-sm" placeholder="Read name (for example, Option 2: hit the roller)" value={draft.options[ctx].name} onChange={e => change(d => { d.options[ctx].name = e.target.value; })} />
                                        <div className="flex justify-between text-xs text-zinc-400">
                                            <span>Starts right after {draft.options[ctx].from === 0 ? 'setup' : `step ${draft.options[ctx].from + 1}`} of the main play.</span>
                                            <button onClick={deleteOption} className="underline text-red-400">Delete read</button>
                                        </div>
                                    </div>
                                )}
                                <div className="flex flex-wrap gap-1">
                                    {vp.steps.map((_, i) => (
                                        <button key={i} onClick={() => { setK(i); setActor(null); }} className={`nav-btn ${k === i ? 'active-nav' : 'inactive-nav'}`}>{ctx == null && i === 0 ? 'Setup' : `Step ${i + 1}`}{ctx == null && (draft.options || []).some(o => o.from === i) ? <Icon name="branch" className="ml-1" /> : ''}</button>
                                    ))}
                                    <button onClick={addStep} className="nav-btn inactive-nav">+ Step</button>
                                </div>

                                {isSetup ? (
                                    <div className="space-y-2">
                                        <div className="text-xs text-zinc-400">Place all five players where they start.</div>
                                        <div className="flex items-center gap-2 text-sm"><span className="text-zinc-400">Ball starts with</span>
                                            {[1, 2, 3, 4, 5].map(p => <button key={p} onClick={() => change(d => { d.ball = p; })} className={`w-9 h-9 rounded-full font-black ${draft.ball === p ? 'bg-orange-500 text-black' : 'bg-zinc-800'}`}>{p}</button>)}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        <div className="grid grid-cols-5 gap-1">
                                            {['cut', 'dribble', 'screen', 'pass', 'shot'].map(tl => <button key={tl} onClick={() => { setTool(tl); setActor(null); }} className={`py-2 rounded font-black uppercase text-xs ${tool === tl ? 'bg-gold text-black' : 'bg-zinc-800 text-zinc-300'}`}>{tl}</button>)}
                                        </div>
                                        <div className="space-y-1">
                                            {(step.moves || []).length === 0 && <div className="text-xs text-zinc-500 italic">No moves yet. Pick an action above, then tap on the court.</div>}
                                            {(step.moves || []).map((m, i) => (
                                                <div key={i} className="flex justify-between items-center text-sm bg-black/40 rounded px-2 py-1.5">
                                                    <span>{m.type === 'shot' ? `${m.p} shoots` : m.type === 'pass' ? `${m.from} passes to ${m.to}` : `${m.p} ${PB_MOVE_LABEL[m.type]} the spot shown${m.bend || (m.path && m.path.length) ? ' (curved)' : ''}`}</span>
                                                    <span className="flex items-center gap-3">
                                                        {(m.bend || (m.path && m.path.length)) && <button onClick={() => change(d => { delete S(d)[k].moves[i].bend; delete S(d)[k].moves[i].path; })} className="text-xs text-zinc-400 underline">Straighten</button>}
                                                        <button onClick={() => change(d => { S(d)[k].moves.splice(i, 1); })} className="text-zinc-500 hover:text-red-400"><Icon name="close" /></button>
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2 text-xs">
                                            <button onClick={() => moveStep(-1)} className="underline text-zinc-400">Move earlier</button>
                                            <button onClick={() => moveStep(1)} className="underline text-zinc-400">Move later</button>
                                            <button onClick={delStep} className="underline text-red-400 ml-auto">Delete step</button>
                                        </div>
                                    </div>
                                )}

                                <textarea rows="2" className="w-full bg-black border border-zinc-700 p-2 rounded text-white text-sm" placeholder={isSetup ? 'Setup caption (for example, Horns set: 4 and 5 at the elbows)' : 'What happens in this step, in one sentence'} value={step.say || ''} onChange={e => change(d => { S(d)[k].say = e.target.value; })} />
                                <details>
                                    <summary className="text-xs text-gold cursor-pointer">"Your job" notes by position (optional)</summary>
                                    <div className="space-y-1 mt-2">
                                        {[1, 2, 3, 4, 5].map(p => (
                                            <div key={p} className="flex items-center gap-2"><span className="w-6 text-center font-black">{p}</span>
                                                <input className="flex-1 bg-black border border-zinc-700 p-1.5 rounded text-white text-sm" placeholder="Leave blank to auto-fill" value={(step.notes || {})[p] || ''} onChange={e => change(d => { S(d)[k].notes = S(d)[k].notes || {}; if (e.target.value) S(d)[k].notes[p] = e.target.value; else delete S(d)[k].notes[p]; })} />
                                            </div>
                                        ))}
                                    </div>
                                </details>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function RosterManager({ rosterData, rosterLoaded, initialTeam, onAdd, onUpdate, onRemove }) {
            // CHANGED: was hardcoded to 'varsity' regardless of which team you were actually viewing in
            // the app — easy to add/edit a player on the wrong team's roster without noticing. Now opens
            // on whichever team is currently active.
            const [team, setTeam] = React.useState(initialTeam || 'varsity');
            const [newName, setNewName] = React.useState('');
            const [newNum, setNewNum] = React.useState('');
            const [newPos, setNewPos] = React.useState('G');
            const [newGrad, setNewGrad] = React.useState('');
            const fullRoster = [...(rosterData[team] || [])].sort((a,b) => a.name.localeCompare(b.name));
            // NEW: split into active players (shown up top, used in live games/lineups) and alumni
            // (kept, just hidden from live-game views — see 'active' field below). A player with no
            // 'active' field yet (anyone added before this feature) counts as active.
            const activeRoster = fullRoster.filter(p => p.active !== false);
            const alumniRoster = fullRoster.filter(p => p.active === false);

            const handleAdd = () => {
                const name = newName.trim();
                if (!name) return;
                const id = parseInt(newNum, 10);
                if (isNaN(id)) return alert("Enter a jersey number for this player.");
                onAdd(team, { id, name, pos: newPos, grad: newGrad.trim(), active: true });
                setNewName(''); setNewNum(''); setNewGrad('');
            };

            const renderRow = (p) => (
                // FIXED: the key now includes the team. With key={p.id} alone, switching Varsity -> JV reused
                // the row for any matching jersey number, and because these inputs only read defaultValue
                // when they first appear, the JV row kept showing the varsity player's name. Clicking in
                // and out of that box then saved the varsity name onto the JV player.
                <div key={`${team}-${p.id}`} className={`bg-zinc-900 border border-zinc-800 rounded-lg p-2 space-y-2 ${p.active===false ? 'opacity-60' : ''}`}>
                    <div className="flex items-center gap-2">
                        <input type="number" defaultValue={p.id} onBlur={e=>{const v=parseInt(e.target.value,10); if(!isNaN(v) && v!==p.id) onUpdate(team, p.id, {id:v});}} className="stat-input w-14" />
                        <input type="text" defaultValue={p.name} onBlur={e=>{const v=e.target.value.trim(); if(v && v!==p.name) onUpdate(team, p.id, {name:v});}} className="stat-input flex-1 text-left" />
                        <input type="text" defaultValue={p.pos} onBlur={e=>{const v=e.target.value.trim(); if(v!==p.pos) onUpdate(team, p.id, {pos:v});}} className="stat-input w-16" />
                        <button onClick={()=>onRemove(team, p.id)} className="stepper-btn hover:bg-red-900/50 hover:text-red-200 w-8 h-8"><Icon name="close" /></button>
                    </div>
                    <div className="flex items-center gap-2 pl-1">
                        <label className="text-[9px] font-bold text-zinc-500 uppercase whitespace-nowrap">Grad Yr</label>
                        <input type="text" placeholder="e.g. 2027" defaultValue={p.grad||''} onBlur={e=>{const v=e.target.value.trim(); if(v!==(p.grad||'')) onUpdate(team, p.id, {grad:v});}} className="stat-input w-20" />
                        <button onClick={()=>onUpdate(team, p.id, {active: p.active===false})} className={`ml-auto px-3 py-1.5 rounded-full text-[10px] font-black uppercase ${p.active===false ? 'bg-zinc-700 text-zinc-300' : 'bg-green-900/40 text-green-300 border border-green-700'}`}>
                            {p.active===false ? <><Icon name="gradcap" className="mr-1" />Alumni — restore to active</> : <><Icon name="check" className="mr-1" />Active — mark alumni</>}
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="space-y-4">
                    <div className="flex gap-2">
                        <button onClick={()=>setTeam('varsity')} className={`nav-btn ${team==='varsity'?'active-nav':'inactive-nav'}`}>Varsity</button>
                        <button onClick={()=>setTeam('jv')} className={`nav-btn ${team==='jv'?'active-nav':'inactive-nav'}`}>JV</button>
                    </div>

                    {!rosterLoaded && <div className="text-xs text-zinc-500 italic">Loading roster…</div>}

                    <div className="space-y-3 max-h-80 overflow-y-auto pr-1">
                        <div className="space-y-2">
                            <div className="text-[10px] font-black uppercase text-green-400">Active ({activeRoster.length})</div>
                            {activeRoster.map(renderRow)}
                            {activeRoster.length === 0 && rosterLoaded && <div className="text-xs text-zinc-600 italic text-center py-2">No active players — add one below.</div>}
                        </div>
                        {alumniRoster.length > 0 && (
                            <div className="space-y-2 border-t border-zinc-800 pt-3">
                                <div className="text-[10px] font-black uppercase text-zinc-500">Alumni ({alumniRoster.length}) — hidden from live games, still in Profiles</div>
                                {alumniRoster.map(renderRow)}
                            </div>
                        )}
                    </div>

                    <div className="border-t border-zinc-800 pt-4 space-y-2">
                        <div className="text-[10px] font-black uppercase text-zinc-500">Add Player</div>
                        <div className="flex gap-2">
                            <input type="number" placeholder="#" value={newNum} onChange={e=>setNewNum(e.target.value)} className="stat-input w-14" />
                            <input type="text" placeholder="Full Name" value={newName} onChange={e=>setNewName(e.target.value)} className="stat-input flex-1 text-left" />
                            <input type="text" placeholder="Pos" value={newPos} onChange={e=>setNewPos(e.target.value)} className="stat-input w-16" />
                            <input type="text" placeholder="Grad Yr" value={newGrad} onChange={e=>setNewGrad(e.target.value)} className="stat-input w-20" />
                        </div>
                        <button onClick={handleAdd} className="w-full py-3 bg-gold hover:bg-white text-black font-black uppercase text-xs rounded-lg">+ Add Player</button>
                    </div>
                </div>
            );
        }

        // New helper for Dashboard strip
        function StatItem({label, value, color, prefix}) { return (<div className="flex flex-col items-center justify-center p-2"><div className="text-[10px] font-black uppercase text-zinc-500 tracking-widest mb-1">{label}</div><div className={`text-2xl font-black italic tracking-tighter ${color||'text-white'}`}>{prefix && value > 0 ? '+' : ''}{value}</div></div>); }
        function Leaderboard({ title, icon, players, valFunc, label }) { return (<div className="bento-card h-full"><div className="flex items-center gap-2 mb-4 border-b border-white/5 pb-2"><Icon name={icon} size={20} className="text-gold" /><h3 className="text-sm font-black uppercase text-zinc-400 tracking-wider">{title}</h3></div><div className="space-y-1">{players.map((p, i) => (<div key={i} className="leader-row"><div className="flex items-center gap-2"><span className="rank-badge">{i+1}</span><span className="leader-name">{p.name.split(' ')[0]}{p.name.split(' ')[1] ? ` ${p.name.split(' ')[1][0]}.` : ''}</span></div><div className="flex items-end"><span className="leader-val">{valFunc(p)}</span>{i===0 && <span className="leader-sub">{label}</span>}</div></div>))}</div></div>); }
        function HonorCard({ label, data, color }) { return (<div className="bg-black/40 border border-white/5 p-3 rounded-lg text-center"><div className="text-[9px] font-bold text-zinc-500 uppercase">{label}</div><div className={`text-2xl font-black ${color}`}>{data.val}</div>{data.val>0 && <div className="text-[8px] text-zinc-400 mt-1">{data.player.split(' ')[0]}</div>}</div>); }
        
        // NEW Helper for End of Season Tab
        function LeaderboardCard({ title, data, dataKey, suffix = '' }) {
            return (
                <div className="bg-black border border-zinc-800 p-4 rounded-lg">
                    <h4 className="text-[10px] font-black uppercase text-zinc-500 mb-3">{title}</h4>
                    <div className="space-y-2">
                        {data.length > 0 ? data.map((p, i) => (
                            <div key={i} className="flex justify-between items-center">
                                <div className="flex items-center gap-2">
                                    <span className={`w-5 h-5 flex items-center justify-center rounded-full text-[10px] font-black ${i === 0 ? 'bg-gold text-black' : 'bg-zinc-800 text-zinc-400'}`}>{i + 1}</span>
                                    <span className="text-sm font-bold">{p.name.split(' ')[0]}{p.name.split(' ')[1] ? ` ${p.name.split(' ')[1][0]}.` : ''}</span>
                                </div>
                                <span className="font-black text-white">{p[dataKey]}{suffix}</span>
                            </div>
                        )) : <div className="text-xs text-zinc-600 italic">No qualified players</div>}
                    </div>
                </div>
            );
        }

        function TrendChart({ games, type }) {
            const ref = React.useRef(null);
            React.useEffect(() => {
                if(!ref.current || !games.length) return;
                const sorted = [...games].reverse();
                const labels = sorted.map(g => (g.opp || 'Unk').substring(0,4));
                let d1=[], d2=[], label1='', label2='', color1='#FFB81C', color2='#ef4444';
                if (type === 'score') { label1='Us'; label2='Them'; d1=sorted.map(g=>g.teamScore||0); d2=sorted.map(g=>g.oppScore||0); }
                else if (type === 'fg') { label1='FG%'; d1=sorted.map(g=>{let m=0,a=0;(g.stats||[]).forEach(s=>{m+=((s.fg2m||0)+(s.fg3m||0));a+=((s.fg2a||0)+(s.fg3a||0))}); return a>0?((m/a)*100).toFixed(1):0;}); }
                else if (type === '3pt') { label1='3PT%'; d1=sorted.map(g=>{let m=0,a=0;(g.stats||[]).forEach(s=>{m+=(s.fg3m||0);a+=(s.fg3a||0)}); return a>0?((m/a)*100).toFixed(1):0;}); }
                else if (type === 'to') { label1='TO'; d1=sorted.map(g=>(g.stats||[]).reduce((acc,s)=>acc+(s.to||0),0)); color1='#ef4444'; }
                else if (type === 'reb') { label1='REB'; d1=sorted.map(g=>(g.stats||[]).reduce((acc,s)=>acc+(s.reb||0),0)); color1='#3b82f6'; }
                else if (type === 'ft') { label1='FT%'; d1=sorted.map(g=>{let m=0,a=0;(g.stats||[]).forEach(s=>{m+=(s.ftm||0);a+=(s.fta||0)}); return a>0?((m/a)*100).toFixed(1):0;}); color1='#22c55e'; }

                const datasets = [{ label:label1, data:d1, borderColor:color1, backgroundColor:color1, tension:0.3 }];
                if(d2.length) datasets.push({ label:label2, data:d2, borderColor:color2, backgroundColor:color2, tension:0.3 });
                
                const chart = new Chart(ref.current.getContext('2d'), { type: type==='to'?'bar':'line', data:{labels,datasets}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'white'}}}, scales:{y:{grid:{color:'#333'},ticks:{color:'#888'}}, x:{grid:{display:false}}}}});
                return () => chart.destroy();
            }, [games, type]);
            return games.length ? <canvas ref={ref} /> : <div className="h-full flex items-center justify-center text-zinc-500 text-xs text-center px-4">Fills in after the first saved game</div>;
        }

        function StatBox({label, val, color}) { return (<div className="bento-card text-center py-4"><div className="text-[10px] font-black uppercase text-zinc-500 tracking-widest mb-1">{label}</div><div className={`text-3xl font-black italic tracking-tighter ${color||'text-white'}`}>{val}</div></div>); }
        function HighBox({label, val}) { return (<div className="bg-black/40 border border-white/5 p-3 rounded-lg text-center"><div className="text-[9px] font-bold text-zinc-500 uppercase">{label}</div><div className="text-2xl font-black text-white">{val}</div></div>); }
        function SplitBar({label, make, att, pct}) { return (<div><div className="flex justify-between text-xs font-bold mb-1"><span className="text-zinc-400 uppercase">{label}</span><span>{make}/{att} <span className={`ml-1 ${att===0?'text-zinc-500':(pct>=50?'text-green-500':(pct<30?'text-red-500':'text-gold'))}`}>({att===0?'—':`${pct}%`})</span></span></div><div className="h-2 bg-black rounded-full overflow-hidden border border-zinc-800"><div style={{width: `${pct}%`}} className={`h-full ${pct>=40?'bg-green-500':'bg-zinc-600'}`}></div></div></div>); }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<><App /><ConfirmHost /></>);
    </script>
</body>
</html>
