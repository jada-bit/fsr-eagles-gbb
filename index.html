    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // FIX: text-gold / bg-gold / border-gold were not real Tailwind classes without this.
        tailwind.config = { theme: { extend: { colors: { gold: '#FFB81C' } } } };
    </script>

    <script>
        // NEW: offline app shell (see sw.js). After one visit on wifi, the app opens even without signal.
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
    </script>
    <style>
        :root { --gold: #FFB81C; --black: #050505; --red: #ef4444; --green: #22c55e; --blue: #3b82f6; --zinc: #18181b; }
        /* NEW: dark native scrollbars and form controls, and no sideways jump when switching tabs */
        html { color-scheme: dark; scrollbar-gutter: stable; }
        .ico { display: inline-block; vertical-align: -0.2em; flex-shrink: 0; }
        .no-scrollbar { scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }
        body { background-color: var(--black); color: white; font-family: 'Barlow Condensed', system-ui, -apple-system, sans-serif; -webkit-print-color-adjust: exact; touch-action: manipulation; }
        
        /* UTILS */
        .bento-card { background: rgba(30, 30, 30, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        .nav-btn { font-size: 12px; font-weight: 800; text-transform: uppercase; padding: 10px 14px; border-radius: 99px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .active-nav { background-color: var(--gold); color: black; box-shadow: 0 0 15px rgba(255, 184, 28, 0.3); }
        .inactive-nav { background: rgba(255,255,255,0.05); color: #888; }
        
        /* LIVE MODE & HUD */
        .live-header { background: #000; border-bottom: 4px solid var(--gold); padding: 10px 15px; position: sticky; top: 0; z-index: 40; display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; align-items: center; }
        .score-val { font-size: 3rem; font-weight: 900; line-height: 1; text-align: center; }
        .score-label { font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; color: #888; text-transform: uppercase; }
        
        .coach-hud { display: grid; grid-template-columns: repeat(6, 1fr) auto auto; gap: 6px; padding: 8px; background: #111; border-bottom: 1px solid #333; align-items: center; }
        .hud-box { text-align: center; background: #222; padding: 6px; border-radius: 6px; border: 1px solid #333; position: relative; }
        .hud-label { font-size: 11px; font-weight: 900; color: #888; text-transform: uppercase; }
        .hud-val { font-size: 20px; font-weight: 900; color: white; }

        @media print {

            .text-white { color: black !important; }

        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideInLeft { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- CONFIG ---
        // NEW: rosters now live in Firestore (collection "rosters", one doc per team) so they can be
        // edited from the app and synced across every device. SEED_TEAMS below is ONLY used the very
        // first time the app runs (before a "rosters" doc exists) to migrate this starting data in.
        // After that first migration, editing this list does nothing — use "Manage Roster" in the app.
        // CHANGED: rosters live in Firestore now. Player names were removed from this file because the
        // page source is public. Manage players with the roster manager (Admin).
        const SEED_TEAMS = { varsity: [], jv: [] };
        const STAT_FIELDS = ['fg2m','fg2a','fg3m','fg3a','ftm','fta','reb','ast','stl','blk','to','pf'];
        const ZONES = ['top_3', 'wing_l_3', 'wing_r_3', 'corn_l_3', 'corn_r_3', 'mid_l_2', 'mid_r_2', 'paint'];
        const OPPONENT_ID = 'OPP';
        // ===== NEW: TEST MODE =====
        // Open the app with ?test at the end of the address (…/eagles-2025-2026/?test) to use a
        // separate copy of every collection (test_games, test_liveGames, ...) with a fake roster.
        // Nothing in test mode reads or changes real data, and real mode never sees test data.
        const TEST_MODE = new URLSearchParams(window.location.search).has('test');
        const COL = (name) => TEST_MODE ? `test_${name}` : name;
        const TEST_COLLECTIONS = ['games', 'liveGames', 'rosters', 'scoutingReports', 'settings', 'gutChecks', 'plays'];
        const TEST_SEED = {
            varsity: Array.from({ length: 10 }, (_, i) => ({ id: i + 1, name: `Varsity Test${i + 1}`, pos: 'G' })),
            jv: Array.from({ length: 10 }, (_, i) => ({ id: i + 21, name: `JV Test${i + 1}`, pos: 'G' }))
        };

        // NEW: local date (not UTC). toISOString() is UTC, which stamped late games with the next day's date.
        const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
        const slugOpp = (name) => (name || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '');
        // NEW: girls basketball 2026-27 schedule (draft, from the AD's sheet). Edit here when it changes.
        // teams: which of our teams play. Postseason games are added once opponents are known.
        const SCHEDULE_2026_27 = [
            { date: '2026-11-19', opp: 'Loudoun Valley', venue: 'Away', teams: ['jv','varsity'], scrim: true },
            { date: '2026-11-23', opp: 'Patriot', venue: 'Home', teams: ['jv','varsity'], scrim: true },
            { date: '2026-11-30', opp: 'Edison', venue: 'Home', teams: ['jv','varsity'] },
            { date: '2026-12-02', opp: 'Chantilly', venue: 'Away', teams: ['varsity'] },
            { date: '2026-12-05', opp: 'South Lakes', venue: 'Away', teams: ['varsity'] },
            { date: '2026-12-09', opp: 'Stone Bridge', venue: 'Home', teams: ['jv','varsity'] },
            { date: '2026-12-10', opp: 'Woodgrove', venue: 'Home', teams: ['jv','varsity'] },
            { date: '2026-12-15', opp: 'Lightridge', venue: 'Home', teams: ['jv','varsity'] },
            { date: '2026-12-18', opp: 'Potomac Falls', venue: 'Away', teams: ['jv','varsity'] },
            { date: '2026-12-29', opp: 'Spotswood', venue: 'Away', teams: ['jv','varsity'] },
            { date: '2026-12-30', opp: 'Stuarts Draft', venue: 'Away', teams: ['jv','varsity'] },
            { date: '2027-01-04', opp: 'Riverside', venue: 'Home', teams: ['jv','varsity'] },
            { date: '2027-01-05', opp: 'Loudoun County', venue: 'Home', teams: ['jv','varsity'] },
            { date: '2027-01-07', opp: 'Champe', venue: 'Away', teams: ['jv','varsity'] },
            { date: '2027-01-08', opp: 'Broad Run', venue: 'Away', teams: ['jv','varsity'] },
            { date: '2027-01-11', opp: 'Heritage', venue: 'Away', teams: ['jv','varsity'] },
            { date: '2027-01-13', opp: 'Hayfield', venue: 'Home', teams: ['varsity'] },
            { date: '2027-01-15', opp: 'Briar Woods', venue: 'Away', teams: ['jv','varsity'] },
            { date: '2027-01-19', opp: 'Potomac Falls', venue: 'Home', teams: ['jv','varsity'] },
            { date: '2027-01-22', opp: 'Lightridge', venue: 'Away', teams: ['jv','varsity'] },
            { date: '2027-01-25', opp: 'Riverside', venue: 'Away', teams: ['jv','varsity'] },
            { date: '2027-01-29', opp: 'Stone Bridge', venue: 'Away', teams: ['jv','varsity'] },
            { date: '2027-02-02', opp: 'Dominion', venue: 'Away', teams: ['jv','varsity'] },
            { date: '2027-02-05', opp: 'Briar Woods', venue: 'Home', teams: ['jv','varsity'] },
            { date: '2027-02-08', opp: 'Champe', venue: 'Home', teams: ['jv','varsity'] }
        ];
        const SCHEDULE_OPPONENTS = Array.from(new Set(SCHEDULE_2026_27.map(g => g.opp))).sort();
        // NEW: snaps a typed name to the schedule's spelling ("stonebridge" -> "Stone Bridge") so
        // history and scouting notes always match up.
        const canonicalOpp = (name) => { const m = SCHEDULE_OPPONENTS.find(o => slugOpp(o) === slugOpp(name)); return m || (name || '').trim(); };

        // ===== NEW: GOALS DASHBOARD =====
        // Every metric is computed from data the app already records, so goals add zero taps.
        // parts(game) returns [numerator, denominator] (or null if the game can't measure it).
        // Counts use denominator 1 per game, so the result is a per-game average.
        const sumP = (g, k) => (g.stats || []).reduce((a, p) => a + (p[k] || 0), 0);
        const oppS = (g, k) => (g.opponentStats || {})[k];
        const GOAL_METRICS = [
            { key: 'pts', label: 'Points scored', better: 'higher', fmt: 'num', parts: g => [g.teamScore || 0, 1] },
            { key: 'ptsAllowed', label: 'Points allowed', better: 'lower', fmt: 'num', parts: g => [g.oppScore || 0, 1] },
            { key: 'margin', label: 'Point margin', better: 'higher', fmt: 'signed', parts: g => [(g.teamScore || 0) - (g.oppScore || 0), 1] },
            { key: 'to', label: 'Turnovers', better: 'lower', fmt: 'num', parts: g => [sumP(g, 'to'), 1] },
            { key: 'forcedTo', label: 'Turnovers forced', better: 'higher', fmt: 'num', parts: g => [oppS(g, 'to') || 0, 1] },
            { key: 'ast', label: 'Assists', better: 'higher', fmt: 'num', parts: g => [sumP(g, 'ast'), 1] },
            { key: 'astTo', label: 'Assist-to-turnover ratio', better: 'higher', fmt: 'ratio', parts: g => [sumP(g, 'ast'), sumP(g, 'to')] },
            { key: 'stl', label: 'Steals', better: 'higher', fmt: 'num', parts: g => [sumP(g, 'stl'), 1] },
            { key: 'reb', label: 'Rebounds', better: 'higher', fmt: 'num', parts: g => [sumP(g, 'reb'), 1] },
            { key: 'rebMargin', label: 'Rebound margin', better: 'higher', fmt: 'signed', parts: g => oppS(g, 'reb') === undefined ? null : [sumP(g, 'reb') - (oppS(g, 'reb') || 0), 1] },
            { key: 'fgPct', label: 'Field goal %', better: 'higher', fmt: 'pct', parts: g => [sumP(g, 'fg2m') + sumP(g, 'fg3m'), sumP(g, 'fg2a') + sumP(g, 'fg3a')] },
            { key: 'fg3Pct', label: '3-point %', better: 'higher', fmt: 'pct', parts: g => [sumP(g, 'fg3m'), sumP(g, 'fg3a')] },
            { key: 'ftPct', label: 'Free throw %', better: 'higher', fmt: 'pct', parts: g => [sumP(g, 'ftm'), sumP(g, 'fta')] },
            { key: 'fta', label: 'Free throw attempts', better: 'higher', fmt: 'num', parts: g => [sumP(g, 'fta'), 1] },
            { key: 'oppFgPct', label: 'Opponent field goal %', better: 'lower', fmt: 'pct', parts: g => [(oppS(g, 'fg2m') || 0) + (oppS(g, 'fg3m') || 0), (oppS(g, 'fg2a') || 0) + (oppS(g, 'fg3a') || 0)] },
            { key: 'oppFta', label: 'Opponent free throw attempts', better: 'lower', fmt: 'num', parts: g => [oppS(g, 'fta') || 0, 1] },
            { key: 'pf', label: 'Fouls committed', better: 'lower', fmt: 'num', parts: g => [sumP(g, 'pf'), 1] }
        ];
        const metricByKey = (k) => GOAL_METRICS.find(m => m.key === k);
        // Placeholder goals until the alignment meeting. The goal text is blank on purpose; targets too.
        const DEFAULT_GOALS = {
            varsity: [ { text: '', metric: 'to', target: '' }, { text: '', metric: 'rebMargin', target: '' }, { text: '', metric: 'oppFgPct', target: '' }, { text: '', metric: 'ftPct', target: '' } ],
            jv: [ { text: '', metric: 'to', target: '' }, { text: '', metric: 'ast', target: '' }, { text: '', metric: 'ftPct', target: '' }, { text: '', metric: 'pf', target: '' } ]
        };
        const aggregateMetric = (metric, games) => {
            let n = 0, d = 0, used = 0;
            games.forEach(g => { const pr = metric.parts(g); if (!pr) return; n += pr[0]; d += pr[1]; used++; });
            if (!used || d === 0) return null;
            return metric.fmt === 'pct' ? (n / d) * 100 : n / d;
        };
        const fmtMetric = (metric, v) => {
            if (v === null || v === undefined || isNaN(v)) return '—';
            if (metric.fmt === 'pct') return `${v.toFixed(1)}%`;
            if (metric.fmt === 'ratio') return v.toFixed(2);
            const r = Math.round(v * 10) / 10;
            return (metric.fmt === 'signed' && r > 0 ? '+' : '') + (Number.isInteger(r) ? r : r.toFixed(1));

        function Icon({ name, size, className = '', style, label }) {
            const markup = ICONS[name];
            if (!markup) return null;
            return <svg viewBox="0 0 24 24" width={size || '1.15em'} height={size || '1.15em'} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                className={`ico ${className}`} style={style} role={label ? 'img' : undefined} aria-label={label} aria-hidden={label ? undefined : 'true'}
                dangerouslySetInnerHTML={{ __html: markup }} />;
        }

        // NEW: in-app "are you sure?" dialog. Native confirm() pop-ups are clunky on an iPad and freeze
        // the page until dismissed. Usage: if (!(await uiConfirm(msg, { confirmLabel, danger }))) return;
        // The first paragraph of msg (before a blank line) is the title, the rest is the detail.
        let _confirmSetter = null;
        const uiConfirm = (message, opts = {}) => new Promise(resolve => {
            if (!_confirmSetter) { resolve(window.confirm(message)); return; }
            _confirmSetter({ message: String(message), confirmLabel: opts.confirmLabel || 'Yes', cancelLabel: opts.cancelLabel || 'Cancel', danger: !!opts.danger, resolve });
        });
        function ConfirmHost() {
            const [req, setReq] = React.useState(null);
            React.useEffect(() => { _confirmSetter = setReq; return () => { _confirmSetter = null; }; }, []);
            if (!req) return null;
            const [title, ...rest] = req.message.split('\n\n');
            const done = (v) => { setReq(null); req.resolve(v); };
            return (
                <div className="fixed inset-0 z-[200] bg-black/80 flex items-center justify-center p-4" onClick={() => done(false)}>
                    <div className="bg-zinc-900 border border-zinc-700 rounded-2xl p-6 w-full max-w-md space-y-4" onClick={e => e.stopPropagation()}>
                        <div className="text-xl font-black">{title}</div>
                        {rest.length > 0 && <p className="text-sm text-zinc-300 whitespace-pre-line">{rest.join('\n\n')}</p>}
                        <div className="flex gap-2">
                            <button onClick={() => done(false)} className="flex-1 py-3 bg-zinc-800 rounded-lg font-bold text-sm">{req.cancelLabel}</button>
                            <button onClick={() => done(true)} className={`flex-1 py-3 rounded-lg font-black uppercase text-sm ${req.danger ? 'bg-red-600 text-white' : 'bg-gold text-black'}`}>{req.confirmLabel}</button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            // STATE
            const [view, setView] = React.useState('live');
            const [games, setGames] = React.useState([]);

            const [db, setDb] = React.useState(null);
            const [toasts, setToasts] = React.useState([]);
            // NEW: connection status for the offline badge.
            const [isOnline, setIsOnline] = React.useState(navigator.onLine);
            React.useEffect(() => {
                const up = () => setIsOnline(true), down = () => setIsOnline(false);
                window.addEventListener('online', up); window.addEventListener('offline', down);
                return () => { window.removeEventListener('online', up); window.removeEventListener('offline', down); };
            }, []);

            // NEW: access control. currentUser comes from Firebase Auth (Email/Password). isEditor is
            // true only for accounts listed in ALLOWED_EDITORS above — everyone else (including anyone
            // not signed in) can view everything but can't change anything. See requireEditor() below,
            // which every write action in this file is gated behind.
            const [currentUser, setCurrentUser] = React.useState(null);
            const [authReady, setAuthReady] = React.useState(false);
            const [showSignIn, setShowSignIn] = React.useState(false);
            const [signInEmail, setSignInEmail] = React.useState('');
            const [signInPassword, setSignInPassword] = React.useState('');
            const emailLc = currentUser && currentUser.email ? currentUser.email.toLowerCase() : null;
            const isAdmin = !!(emailLc && ALLOWED_EDITORS.map(e=>e.toLowerCase()).includes(emailLc));
            const isStatKeeperAccount = !!(emailLc && STAT_KEEPER_ACCOUNTS.map(e=>e.toLowerCase()).includes(emailLc));
            const isEditor = isAdmin || isStatKeeperAccount;
            const requireEditor = () => {
                if (isEditor) return true;
                showToast(currentUser ? "This account isn't approved to edit — ask the coach to add it" : "Sign in to make changes", "error");
                return false;

            const signInWithEmail = () => {

                    .catch(e => showToast("Sign-in failed: " + e.message, "error"));

            const sendPasswordReset = () => {
                if (!signInEmail) return showToast("Enter your email first, then tap this again", "error");
                firebase.auth().sendPasswordResetEmail(signInEmail.trim())
                    .then(() => showToast("Password reset email sent", "success"))
                    .catch(e => showToast("Couldn't send reset email: " + e.message, "error"));

            const signOutUser = () => firebase.auth().signOut();

            // NEW: which team & season is currently active. Everything below filters on these.
            const [activeTeam, setActiveTeam] = useStickyState('varsity', 'eagles_team');
            const [activeSeason, setActiveSeason] = useStickyState(CURRENT_SEASON_DEFAULT, 'eagles_season');

            // NEW: rosters now come from Firestore so every device sees the same players. See SEED_TEAMS above.
            const [rosterData, setRosterData] = React.useState(SEED_TEAMS);
            const [rosterLoaded, setRosterLoaded] = React.useState(false);
            const [showRosterManager, setShowRosterManager] = React.useState(false);
            const ROSTER = rosterData[activeTeam] || [];
            // NEW: players marked inactive/alumni (see RosterManager) are kept in the roster forever so
            // their history stays reachable, but shouldn't clutter live-game selection, lineups, or the
            // active roster's stat placeholders. A player with no 'active' field yet counts as active.
            const ACTIVE_ROSTER = ROSTER.filter(p => p.active !== false);

            // STICKY DATA
            // NEW: these fields are the "live game in progress" — they now live in Firestore
            // (collection "liveGames", one doc per team) instead of only this device's localStorage,
            // so two people can stat-keep the same game from two phones and see each other's taps in
            // real time. localStorage is kept as a same-device fallback only (useStickyState below),
            // used purely as the initial value before Firestore's first snapshot arrives, or if this
            // device is offline. See pushLive/applyLiveSnapshot and the sync effect further down.
            const defaultGameMeta = () => ({ date: localToday(), opp: '', oppScore: 0, venue: 'Home', quarter: 1 });
            const defaultOpponentStats = () => ({ fg2m:0, fg2a:0, fg3m:0, fg3a:0, ftm:0, fta:0, to:0 });
            const defaultTimeouts = () => ({ full: [true,true,true], thirty: [true,true] });
            const defaultPlayStats = () => ([
                { id: 'trans', name: 'TRANSITION', att: 0, made: 0, pts: 0 },

            // active, so starting a JV game before a lineup had ever been saved for JV would seed the
            // "on court" starters using VARSITY jersey numbers — any JV player who happened to share one
            // of those numbers would show up pre-selected as a starter she was never subbed into. Now

            const defaultLineup = () => {
                const teamRoster = rosterData[activeTeam] || [];

            const [eventLog, setEventLogRaw] = useStickyState([], 'eagles_events');
            // NEW: running point differential per player, updated automatically every time either team
            // scores (see applyScoreToLineup below) — no extra taps needed, since it's derived entirely
            // from stats you're already recording (who's on court + who scored). Feeds the "Tactics" tab.
            const [plusMinus, setPlusMinusRaw] = useStickyState({}, 'eagles_plusminus');
            // NEW: shot locations tapped on the shot chart (see ShotChartPanel) — saved per game so a
            // shot heatmap can be built later. Not yet visualized anywhere, just captured for now.
            const [shotLog, setShotLogRaw] = useStickyState([], 'eagles_shotlog');
            
            // GAME MANAGEMENT STATES
            const [timeouts, setTimeoutsRaw] = useStickyState(defaultTimeouts(), 'eagles_timeouts');
            const [possession, setPossessionRaw] = useStickyState('home', 'eagles_possession');
            const [quarterFouls, setQuarterFoulsRaw] = useStickyState(0, 'eagles_q_fouls');
            // NEW: opponent team fouls this period, so the HUD can show when WE are in the bonus.
            const [oppQuarterFouls, setOppQuarterFoulsRaw] = useStickyState(0, 'eagles_opp_q_fouls');

            // NEW: true while viewing/editing an OLD saved game (via Log > Edit). While true, changes are
            // local-only and are not broadcast to (or overwritten by) the shared live game in Firestore,
            // so fixing a past box score can't stomp on a game currently being tracked live elsewhere.
            const editingHistoryRef = React.useRef(false);

            // NEW: writes a partial update of the live game to Firestore. No-ops while offline or while
            // editing history (see editingHistoryRef above).
            const pushLive = (fields) => {
                if (!db || editingHistoryRef.current) return;
                db.collection(COL('liveGames')).doc(activeTeam).set({ ...fields, updatedAt: Date.now() }, { merge: true }).catch(() => {});
            };

            // Wrapped setters: same names/call signature as plain useState setters (supports the
            // `setX(value)` and `setX(prev => next)` forms used throughout this file). Each one (a)
            // blocks the change entirely if the current account isn't an approved editor, and (b)

            // picks it up within moments. This one factory is the choke point for every single live-game
            // mutation in the app (stat taps, undo, subs, quarters, timeouts, possession, resets,
            // opponent name/score, playbook) — gating it here gates all of them at once.
            const guardedUpdate = (setRaw, key) => (u) => {
                if (!requireEditor()) return;
                setRaw(prev => { const next = typeof u==='function'?u(prev):u; pushLive({ [key]: next }); return next; });
            };
            const setGameMeta = guardedUpdate(setGameMetaRaw, 'gameMeta');
            const setPlayerStats = guardedUpdate(setPlayerStatsRaw, 'playerStats');
            const setOpponentStats = guardedUpdate(setOpponentStatsRaw, 'opponentStats');
            const setActiveLineup = guardedUpdate(setActiveLineupRaw, 'activeLineup');

                setPlayerStatsRaw(data.playerStats || {});
                setOpponentStatsRaw(data.opponentStats || defaultOpponentStats());

                setPlayStatsRaw(data.playStats || defaultPlayStats());
                setEventLogRaw(data.eventLog || []);

                setQuarterFoulsRaw(data.quarterFouls || 0);
                setOppQuarterFoulsRaw(data.oppQuarterFouls || 0);

            const [trackingOpponent, setTrackingOpponent] = React.useState(false);
            const [subTarget, setSubTarget] = React.useState(null); 
            const [editId, setEditId] = React.useState(null);
            const [showSnapshot, setShowSnapshot] = React.useState(false);
            const [shotMode, setShotMode] = React.useState('make');

            // NEW: Player of the Game. Auto-computed at save time (see computeAutoPOTG), but a coach

            const [potgOverride, setPotgOverrideRaw] = useStickyState(null, 'eagles_potg_override');
            const setPotgOverride = guardedUpdate(setPotgOverrideRaw, 'potgOverride');

            // NEW: Scouting reports, one doc per opponent (see 'scoutingReports' collection below).

            const [scoutReports, setScoutReports] = React.useState({});
            const [scoutSection, setScoutSection] = React.useState('Personnel');

            const [goalsConfig, setGoalsConfig] = React.useState(null);

            }, [rosterKey, selectedProfile]);
            const [sortConfig, setSortConfig] = React.useState({ key: 'ppg', direction: 'desc' });
            
            // AI
            const [chatHistory, setChatHistory] = React.useState([{role: 'bot', text: 'Coach, I\'m ready. Ask me things like "Who is the MVP?", "Who\'s our best defender?", "What should we work on?", or a player\'s name.'}]);
            const [query, setQuery] = React.useState('');

            const computeAutoPOTG = (statsArr) => {

                const teamFGM = Object.values(playerStats).reduce((a,s) => a + (s.fg2m||0) + (s.fg3m||0), 0);

                const teamFTA = Object.values(playerStats).reduce((a,s) => a + (s.fta||0), 0);
                
                const fgPct = teamFGA > 0 ? Math.round((teamFGM/teamFGA)*100) : 0;
                const fg3Pct = team3PA > 0 ? Math.round((team3PM/team3PA)*100) : 0;
                const ftPct = teamFTA > 0 ? Math.round((teamFTM/teamFTA)*100) : 0;

                // NEW: opponent shooting — the snapshot previously only showed OUR numbers, which isn't

                const clean = goalsDraft.filter(g => g.metric).slice(0, 5).map(g => ({ text: (g.text || '').trim(), metric: g.metric, target: (g.target === '' || g.target === undefined) ? '' : String(g.target).trim() }));
                db.collection(COL('settings')).doc('goals').set({ [activeTeam]: clean }, { merge: true }).catch(e => showToast("Couldn't save goals: " + e.message, "error"));
                setEditingGoals(false);
                showToast(`${teamName(activeTeam)} goals saved`, "success");
            };
            // Live game as a game-shaped object, so Quick summary can check goals mid-game.
            const liveGameForGoals = { stats: Object.entries(playerStats).map(([name, st]) => ({ name, ...st })), opponentStats, teamScore: getTeamScore(), oppScore: gameMeta.oppScore };

            // Weekly gut check: one entry per team per week (week starts Monday).
            const weekKey = weekStartKey();
            const gutId = `${activeTeam}_${weekKey}`;
            const teamGutChecks = gutChecks.filter(x => x.team === activeTeam).sort((a, b) => (b.weekStart || '').localeCompare(a.weekStart || ''));
            React.useEffect(() => {
                if (gutPrefillRef.current === gutId) return;
                const existing = gutChecks.find(x => x.id === gutId);
                if (existing || gutChecks.length || goalsConfig) {
                    setGutDraft({ working: existing?.working || '', adjust: existing?.adjust || '', focus: existing?.focus || '' });
                    gutPrefillRef.current = gutId;
                }
            }, [gutId, gutChecks, goalsConfig]);
            const saveGutCheck = () => {
                if (!isAdmin || !db) return;
                const snapshot = goalRows.filter(r => r.metric).map(r => `${r.metric.label}: ${fmtMetric(r.metric, r.last3V)} last 3${r.goal.target !== '' ? ` (target ${r.goal.target})` : ''}${r.status ? `, ${STATUS_TEXT[r.status].toLowerCase()}` : ''}`);
                db.collection(COL('gutChecks')).doc(gutId).set({ team: activeTeam, season: activeSeason, weekStart: weekKey, ...gutDraft, snapshot, author: currentUser?.email || 'Coach', updatedAt: new Date().toISOString() }, { merge: true })
                    .catch(e => showToast("Couldn't save gut check: " + e.message, "error"));
                showToast("Gut check saved", "success");
            };

            // NEW: wipes every test_ collection so a test run can start fresh. Only works in test mode.
            const clearTestData = async () => {
                if (!TEST_MODE || !isAdmin || !db) return;
                if (!(await uiConfirm("Clear ALL test data?\n\nThis only deletes test_ collections. Real data is not touched."))) return;
                try {
                    for (const name of TEST_COLLECTIONS) {
                        const snap = await db.collection(`test_${name}`).get();
                        for (let k = 0; k < snap.docs.length; k += 400) { const b = db.batch(); snap.docs.slice(k, k + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
                    }
                    Object.keys(window.localStorage).filter(k => k.startsWith('test_')).forEach(k => window.localStorage.removeItem(k));
                    showToast("Test data cleared. Reloading…", "success");
                    setTimeout(() => window.location.reload(), 800);
                } catch (e) { showToast("Couldn't clear test data: " + e.message, "error"); }
            };

            // NEW: Live game fills exactly the rest of the screen on iPad, so nothing scrolls.
            const liveRef = React.useRef(null);
            const [liveHeight, setLiveHeight] = React.useState(null);
            React.useEffect(() => {
                if (view !== 'live') return;
                const measure = () => {
                    const el = liveRef.current; if (!el) return;
                    if (window.innerWidth < 768) { setLiveHeight(null); return; }
                    const top = el.getBoundingClientRect().top + window.scrollY;
                    setLiveHeight(Math.max(460, window.innerHeight - top - 8));
                };
                const raf = requestAnimationFrame(measure);
                window.addEventListener('resize', measure); window.addEventListener('orientationchange', measure);
                return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', measure); window.removeEventListener('orientationchange', measure); };
            }, [view, keeperOnly, backupDue, isEditor, activeLineup.length]);

            // NEW: sign-in gate. Without a coach or stat keeper login, nothing is shown or loaded.
            if (!authReady) return <div className="p-20 text-center text-gold font-bold">LOADING...</div>;
            if (!isEditor) return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="bento-card w-full max-w-md space-y-4">
                        <div className="text-center"><img src={EAGLE_LOGO} alt="Eagles" className="mx-auto" style={{ height: 72, width: "auto" }} /><h1 className="text-2xl font-black italic uppercase mt-2">Eagles <span className="text-gold">Analytics</span></h1>{TEST_MODE && <div className="mt-2 text-xs font-black uppercase text-orange-300">Test mode</div>}</div>
                        {currentUser ? (
                            <>
                                <p className="text-sm text-zinc-300 text-center">Signed in as {currentUser.email}, which doesn't have access. Ask the coach to add this account.</p>
                                <button onClick={signOutUser} className="w-full py-3 bg-zinc-800 rounded-lg font-black uppercase text-xs">Sign out</button>
                            </>

                            <>
                                <p className="text-sm text-zinc-400 text-center">Coaches and stat keepers, sign in to continue.</p>

                                <input type="password" value={signInPassword} onChange={e=>setSignInPassword(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') signInWithEmail(); }} placeholder="Password" className="w-full bg-black border border-zinc-700 p-3 rounded text-white font-bold" />

                            </>

                    </div>

            if(loading) return <div className="p-20 text-center text-gold font-bold">LOADING DATA...</div>;

            const clipboard = getClipboardData();

            const lineupPlusMinus = getSeasonPlusMinus();
            const profile = profileScope === 'career' ? getCareerStats(selectedProfile) : getPlayerData(selectedProfile);
            const playerInfo = ROSTER.find(p => p.name === selectedProfile) || {};
            const activePlayers = ACTIVE_ROSTER.filter(p => activeLineup.includes(p.id));
            const benchPlayers = ACTIVE_ROSTER.filter(p => !activeLineup.includes(p.id));
            
            // INSIGHTS & TRENDS
            const insights = getGameInsights();

                            {authReady && (isEditor ? (

                    {TEST_MODE && (

                    {backupDue && !keeperOnly && view !== 'live' && (

                            <div className="flex gap-2 items-center">
                                <button onClick={()=>setBackupSnooze(Date.now() + 24 * 60 * 60 * 1000)} className="py-2 px-3 text-blue-300 text-xs underline whitespace-nowrap">Remind me tomorrow</button>
                                <button onClick={downloadBackup} className="py-2 px-4 bg-blue-700 hover:bg-blue-600 rounded font-black uppercase text-xs whitespace-nowrap">Download backup</button>
                            </div>
                        </div>
                    )}

                    {teamSwitchTarget && (
                        <div className="fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4">

                                <div className="text-xl font-black uppercase">Switch to {teamName(teamSwitchTarget)}?</div>
                                <p className="text-sm text-zinc-300">The {teamName(activeTeam)} game{gameMeta.opp ? ` vs ${gameMeta.opp}` : ''} has stats that haven't been saved. Save it first so the two games don't get mixed up.</p>
                                <button onClick={async ()=>{ const t = teamSwitchTarget; setTeamSwitchTarget(null); const ok = await saveGame({ stay: true }); if (ok) setActiveTeam(t); }} className="w-full py-3 bg-gold text-black rounded-lg font-black uppercase text-sm">Save {teamName(activeTeam)} game, then switch</button>
                                <button onClick={()=>{ const t = teamSwitchTarget; setTeamSwitchTarget(null); setActiveTeam(t); }} className="w-full py-3 bg-zinc-800 rounded-lg font-bold text-sm">Switch and keep it in progress</button>
                                <button onClick={()=>setTeamSwitchTarget(null)} className="w-full py-2 text-zinc-400 text-sm underline">Cancel</button>
                            </div>
                        </div>
                    )}

                    {/* LIVE VIEW */}
                    {view === 'live' && (
                        <div ref={liveRef} className="flex flex-col overflow-hidden" style={liveHeight ? { height: liveHeight } : undefined}>
                            {authReady && !isEditor && (
                                <div className="bg-yellow-900/30 border border-yellow-700 text-yellow-300 text-xs font-bold uppercase text-center py-2 rounded-lg mb-2"><Icon name="eye" className="mr-1.5" />View only. Tap Sign In To Edit at the top to record stats</div>
                            )}
                            {liveHasStats && gameMeta.date && gameMeta.date !== localToday() && (
                                <div className="bg-orange-900/30 border border-orange-600 text-orange-200 text-xs font-bold text-center py-2 rounded-lg mb-2"><Icon name="warning" className="mr-1.5" />This game in progress is from {gameMeta.date}{gameMeta.opp ? ` vs ${gameMeta.opp}` : ''}. Save it or reset it before tipoff.</div>
                            )}
                            {activeLineup.length > 0 && activePlayers.length < activeLineup.length && (
                                <div className="bg-red-900/30 border border-red-700 text-red-300 text-xs font-bold uppercase text-center py-2 rounded-lg mb-2 flex items-center justify-between gap-2 px-3">
                                    <span><Icon name="warning" className="mr-1.5" />Only {activePlayers.length}/{activeLineup.length} starters found — a lineup slot doesn't match the current roster (probably a jersey number changed)</span>
                                    <button onClick={fixLineup} className="underline whitespace-nowrap">Fix Lineup</button>
                                </div>
                            )}
                            <div className="live-header">
                                <div className="score-box"><div className="score-label">EAGLES</div><div className="score-val text-gold">{getTeamScore()}</div>
                                    <div className="text-[10px] text-zinc-500 font-bold text-center mt-1">Timeouts left (60 sec / 30 sec)</div>
                                    <div className="timeout-pills">
                                        {timeouts.full.map((t,i)=><div key={`f-${i}`} onClick={()=>toggleTimeout('full',i)} className={`to-pill ${t?'active':'used'}`}>60</div>)}
                                        {timeouts.thirty.map((t,i)=><div key={`30-${i}`} onClick={()=>toggleTimeout('thirty',i)} className={`to-pill ${t?'active':'used'}`}>30</div>)}
                                    </div>
                                </div>
                                <div className="flex flex-col items-center gap-1"><div onClick={togglePossession} className="poss-arrow text-white"><Icon name={possession==='home'?'arrowLeft':'arrowRight'} size={36} className="text-gold" label={possession==='home'?'Our ball':'Their ball'} /></div><div className="text-zinc-500 font-black text-xs text-center leading-tight">Possession<br/>arrow</div></div>
                                <div className="score-box"><div className="flex justify-center mb-1"><div className="score-val text-white" title="Opponent points come from logged baskets and free throws, so every point can be undone">{gameMeta.oppScore}</div></div><input list="opp-suggestions" value={gameMeta.opp} onChange={e=>setGameMeta({...gameMeta, opp:e.target.value})} aria-label="Opponent" className={`text-center score-label w-full outline-none rounded-md py-1 ${(gameMeta.opp||'').trim() ? 'bg-transparent border border-transparent' : 'bg-black border border-dashed border-gold text-gold placeholder-yellow-600'}`} placeholder="Tap to add opponent"/>
                                    <div className="flex justify-center items-center gap-2 mt-1">
                                        <button onClick={()=>setGameMeta(prev=>({ ...prev, venue: prev.venue === 'Home' ? 'Away' : 'Home' }))} title="Tap to switch Home or Away" className="px-3 py-1 rounded-full bg-zinc-800 border border-zinc-700 text-zinc-200 text-[11px] font-black uppercase">{gameMeta.venue || 'Home'}</button>
                                        {(gameMeta.opp||'').trim() && isScrimGame({ date: gameMeta.date, opp: gameMeta.opp }) && <span className="px-2 py-1 rounded-full bg-zinc-800 text-zinc-400 text-[11px] font-black uppercase">Scrimmage</span>}
                                    </div>

                            {/* NEW: "?" help screen. Tap anywhere to close. */}
                            {showHelp && (
                                <div className="fixed inset-0 z-[110] bg-black/85 flex items-center justify-center p-4" onClick={()=>setShowHelp(false)}>

                                        <div className="text-center mb-5">

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">

                                                ['Everything else for us', 'Tap the button (rebound, steal, foul, and so on), then the player.'],

                                                ['Made a mistake?', 'Tap the play in Recent plays and confirm to undo it.'],
                                                ['Timeouts', 'Tap a gold dot to use one. If it was a mistake, undo it from Recent plays.'],
                                                ['Subs', 'Tap the swap button on the player coming out, then pick who goes in.'],
                                                ['New quarter', 'Tap the next quarter at the top. Team fouls reset on their own (not in overtime).'],

                                                    <div className="font-black uppercase text-white mb-1">{h}</div>

service cloud.firestore {
  match /databases/{db}/documents {

      return request.auth != null &&
        request.auth.token.email in [
          "coach@gmail.com"
        ];

    match /{document=**} {

    }

}`}</pre>

                                    </div>
                                )}

                                <div className="text-[10px] font-black text-gold uppercase tracking-widest mb-1">Us</div>
                                <div className="snap-grid">
                                    <div className="snap-stat-box"><div className="snap-stat-label">SHOOTING</div><div className={`snap-stat-val ${insights.teamFGA===0?'text-white':(insights.fgPct>=45?'text-green-500':(insights.fgPct<35?'text-red-500':'text-white'))}`}>{insights.teamFGM}/{insights.teamFGA}</div><div className="snap-stat-sub">{insights.fgPct}%</div></div>
                                    <div className="snap-stat-box"><div className="snap-stat-label">FREE THROWS</div><div className="snap-stat-val">{insights.teamFTM}/{insights.teamFTA}</div><div className="snap-stat-sub">{insights.ftPct}%</div></div>
                                    <div className="snap-stat-box"><div className="snap-stat-label">REBOUNDS</div><div className="snap-stat-val text-blue-500">{insights.teamReb}</div></div>
                                    <div className="snap-stat-box"><div className="snap-stat-label">TURNOVERS</div><div className={`snap-stat-val ${insights.teamTO>=12?'text-red-500':'text-white'}`}>{insights.teamTO}</div></div>
                                </div>

                                <div className="text-[10px] font-black text-red-400 uppercase tracking-widest mb-1 mt-4">Opponent</div>
                                <div className="snap-grid">
                                    <div className="snap-stat-box"><div className="snap-stat-label">SHOOTING</div><div className={`snap-stat-val ${insights.oppFgPct>=45?'text-red-400':'text-white'}`}>{insights.oppFGM}/{insights.oppFGA}</div><div className="snap-stat-sub">{insights.oppFgPct}%</div></div>
                                    <div className="snap-stat-box"><div className="snap-stat-label">3PT%</div><div className={`snap-stat-val ${insights.opp3Pct>=38?'text-red-400':'text-white'}`}>{insights.opp3Pct}%</div></div>
                                    <div className="snap-stat-box"><div className="snap-stat-label">FREE THROWS</div><div className="snap-stat-val">{insights.oppFTM}/{insights.oppFTA}</div><div className="snap-stat-sub">{insights.oppFtPct}%</div></div>
                                    <div className="snap-stat-box"><div className="snap-stat-label">TURNOVERS</div><div className="snap-stat-val text-green-500">{opponentStats.to||0}</div><div className="snap-stat-sub">incl. our steals</div></div>
                                </div>

                                <div className="outlier-section mt-4">
                                    {insights.hotPlayers.map(p=><div key={p.name} className="outlier-card border-green-500"><div className="outlier-icon"><Icon name="flame" size={20} /></div><div className="outlier-name">{p.name}</div><div className="outlier-detail">{p.val}</div></div>)}
                                    {insights.coldPlayers.map(p=><div key={p.name} className="outlier-card border-red-500"><div className="outlier-icon"><Icon name="snowflake" size={20} /></div><div className="outlier-name">{p.name}</div><div className="outlier-detail">{p.val}</div></div>)}
                                    {insights.foulTrouble.map(p=><div key={p.name} className="outlier-card border-yellow-500"><div className="outlier-icon"><Icon name="warning" size={20} /></div><div className="outlier-name">{p.name}</div><div className="outlier-detail">{p.val}</div></div>)}
                                    {insights.hotPlayers.length===0 && insights.coldPlayers.length===0 && insights.foulTrouble.length===0 && <div className="text-center text-zinc-500 italic text-sm p-4">No significant outliers detected yet.</div>}
                                </div>

                                {Object.keys(plusMinus).length > 0 && (
                                    <div className="mt-4">
                                        <div className="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-2">This Game — Lineup +/-</div>
                                        <div className="grid grid-cols-2 gap-2">
                                            {Object.entries(plusMinus).sort((a,b)=>b[1]-a[1]).map(([name,net]) => (
                                                <div key={name} className="flex justify-between items-center bg-zinc-900/50 rounded px-3 py-2"><span className="text-xs font-bold">{name.split(' ')[0]}</span><span className={`font-black text-sm ${net>0?'text-green-500':(net<0?'text-red-500':'text-zinc-400')}`}>{net>0?'+':''}{net}</span></div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="mt-4">
                                    <div className="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-2">Shot Chart — This Game</div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <div className="text-[10px] font-black text-gold uppercase mb-1 text-center">Us ({shotLog.filter(s=>(s.team||'us')==='us').length})</div>
                                            <CourtSVG>{shotLog.filter(s=>(s.team||'us')==='us').map(s => <circle key={s.id} cx={shotXY(s)[0]} cy={shotXY(s)[1]} r="6" fill={s.made ? '#22c55e' : '#ef4444'} fillOpacity="0.8" stroke="white" strokeWidth="1" />)}</CourtSVG>
                                        </div>
                                        <div>
                                            <div className="text-[10px] font-black text-red-400 uppercase mb-1 text-center">Opponent ({shotLog.filter(s=>s.team==='opp').length})</div>
                                            <CourtSVG>{shotLog.filter(s=>s.team==='opp').map(s => <circle key={s.id} cx={shotXY(s)[0]} cy={shotXY(s)[1]} r="6" fill={s.made ? '#22c55e' : '#ef4444'} fillOpacity="0.8" stroke="white" strokeWidth="1" />)}</CourtSVG>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showRosterManager && (
                        <div className="modal-overlay" onClick={() => setShowRosterManager(false)}>
                            <div className="modal-content" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4"><h3 className="text-2xl font-black uppercase text-gold">Manage Roster</h3><button onClick={() => setShowRosterManager(false)} className="text-2xl"><Icon name="close" /></button></div>
                                <RosterManager
                                    rosterData={rosterData}
                                    rosterLoaded={rosterLoaded}
                                    initialTeam={activeTeam}
                                    onAdd={addRosterPlayer}
                                    onUpdate={updateRosterPlayer}
                                    onRemove={removeRosterPlayer}
                                />
                            </div>
                        </div>
                    )}

                    {showSignIn && (
                        <div className="modal-overlay" onClick={() => setShowSignIn(false)}>
                            <div className="modal-content" style={{maxWidth: '380px'}} onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4"><h3 className="text-2xl font-black uppercase text-gold">Sign In</h3><button onClick={() => setShowSignIn(false)} className="text-2xl"><Icon name="close" /></button></div>
                                <div className="space-y-3">
                                    <div className="space-y-1"><label className="text-[9px] font-bold text-zinc-500 uppercase">Email</label><input type="email" autoFocus value={signInEmail} onChange={e=>setSignInEmail(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')signInWithEmail();}} className="w-full bg-black border border-zinc-700 p-3 rounded text-white font-bold" placeholder="you@email.com" /></div>
                                    <div className="space-y-1"><label className="text-[9px] font-bold text-zinc-500 uppercase">Password</label><input type="password" value={signInPassword} onChange={e=>setSignInPassword(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')signInWithEmail();}} className="w-full bg-black border border-zinc-700 p-3 rounded text-white font-bold" placeholder="••••••••" /></div>
                                    <button onClick={signInWithEmail} className="w-full py-3 bg-gold hover:bg-white text-black font-black uppercase text-sm rounded-lg">Sign In</button>
                                    <button onClick={sendPasswordReset} className="w-full text-center text-[10px] text-zinc-500 hover:text-white underline uppercase font-bold">Forgot password?</button>
                                    <p className="text-[10px] text-zinc-600 text-center">Don't have an account? Ask the coach to add your email in Firebase Authentication.</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // NEW: shot-chart geometry. Court is drawn on a 500x470 viewBox with the hoop near the TOP
        // (flipped from the original bottom-hoop orientation) — this is where taps get converted from
        // screen coordinates and classified as a 2 or 3 pointer, matching real NBA-style court
        // proportions (straight corner lines, then an arc).
        // CHANGED: real high school (NFHS) half court at 10 units per foot: 50 ft wide x 42 ft deep.
        // Baseline y=10, half court y=430, rim center 5 ft 3 in from the baseline, 3-point arc 19 ft 9 in,
        // with straight corner lines from the baseline to the arc's center line.
        const HOOP = { x: 250, y: 62.5 };
        const THREE_PT_RADIUS = 197.5;
        const THREE_PT_BREAK_Y = 62.5; // closer to the baseline than this, the 3PT line is the straight corner segment
        const THREE_PT_CORNER_X = 52.5;
        const isThreePointShot = (x, y) => {
            if (y <= THREE_PT_BREAK_Y) return x <= THREE_PT_CORNER_X || x >= 500 - THREE_PT_CORNER_X;
            return Math.hypot(x - HOOP.x, y - HOOP.y) >= THREE_PT_RADIUS;
        };
        // Shots logged on the old (inaccurate) court have no v:2. Map them onto the new court so they
        // keep the same position relative to the rim and the 3-point line.
        const OLD_TO_NEW = 197.5 / 220;
        const shotXY = (sh) => sh.v === 2 ? [sh.x, sh.y] : [250 + (sh.x - 250) * OLD_TO_NEW, 62.5 + (sh.y - 42) * OLD_TO_NEW];

        // A real-looking half court: baseline, key, free-throw circle, restricted area, backboard,
        // rim, 3PT line (straight corners + arc), and a sliver of the half-court line/circle down low.
        // `onTap(x, y)` fires with coordinates in the court's own 500x470 space — converted from
        // screen pixels via getScreenCTM so it works correctly at any rendered size (mobile included).
        // `children` renders on top of the court (used for shot markers).
        function CourtSVG({ onTap, children }) {
            const svgRef = React.useRef(null);
            const handleClick = (e) => {
                if (!onTap || !svgRef.current) return;
                const svg = svgRef.current;
                const pt = svg.createSVGPoint();
                pt.x = e.clientX; pt.y = e.clientY;
                const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
                onTap(loc.x, loc.y);
            };
            return (
                <svg ref={svgRef} viewBox="0 0 500 440" onClick={handleClick}
                     style={{ width: '100%', height: 'auto', display: 'block', cursor: onTap ? 'crosshair' : 'default', touchAction: 'manipulation', background: '#dcb386', borderRadius: '8px', border: '2px solid #333' }}>
                    <rect x="190" y="10" width="120" height="190" fill="#cfa577" />
                    <rect x="1.25" y="10" width="497.5" height="420" fill="none" stroke="white" strokeWidth="2.5" />
                    <rect x="190" y="10" width="120" height="190" fill="none" stroke="white" strokeWidth="2.5" />
                    <path d="M 190 200 A 60 60 0 0 0 310 200" fill="none" stroke="white" strokeWidth="2.5" />
                    <path d="M 190 200 A 60 60 0 0 1 310 200" fill="none" stroke="white" strokeWidth="2.5" strokeDasharray="8 8" />
                    <path d="M 52.5 10 L 52.5 62.5 A 197.5 197.5 0 0 0 447.5 62.5 L 447.5 10" fill="none" stroke="white" strokeWidth="2.5" />
                    <path d="M 190 430 A 60 60 0 0 1 310 430" fill="none" stroke="white" strokeWidth="2.5" />
                    {[80, 110, 140, 170].map(y => (
                        <g key={y}>
                            <line x1="182" y1={y} x2="190" y2={y} stroke="white" strokeWidth={y === 80 ? 7 : 2} />
                            <line x1="310" y1={y} x2="318" y2={y} stroke="white" strokeWidth={y === 80 ? 7 : 2} />
                        </g>
                    ))}
                    <line x1="220" y1="50" x2="280" y2="50" stroke="#333" strokeWidth="5" />
                    <circle cx="250" cy="62.5" r="7.5" fill="none" stroke="#ff6a00" strokeWidth="3" />
                    {children}
                </svg>
            );
        }

        // NEW: the shot-entry flow — tap a spot on the court (auto-detects 2PT vs 3PT), then one tap
        // picks BOTH who shot it AND made/missed (a row per player with a made and a missed button — used to be
        // two separate steps). If it's a make, immediately asks who assisted (or No Assist); if it's a
        // miss, immediately asks who got the rebound (or Skip) — either way, no leaving this flow to
        // find the ASSIST/REBOUND buttons elsewhere. Free throws are NOT part of this flow — they still
        // use the regular FT MAKE/MISS buttons, since a free throw doesn't have a variable location.
        // Rendered directly inline in the live tab, not a popup.
        function ShotChartPanel({ firstShot, activePlayers, onCommit, onRebound, onAssist, onOpponentCommit, onOpponentRebound }) {
            const [step, setStep] = React.useState('location');
            const [pending, setPending] = React.useState(null);
            const [scorerId, setScorerId] = React.useState(null);

            const handleTap = (x, y) => { setPending({ x, y, isThree: isThreePointShot(x, y) }); setStep('playerResult'); };
            const startOver = () => { setStep('location'); setPending(null); setScorerId(null); };
            const commit = (p, made) => {
                onCommit(p.id, pending.isThree, made, pending.x, pending.y);
                if (made) { setScorerId(p.id); setStep('assist'); } else setStep('rebound');
            };
            const finishRebound = (pid) => { if (pid) onRebound(pid); startOver(); };
            const finishAssist = (pid) => { if (pid) onAssist(pid); startOver(); };
            // NEW: "They got it" now records an opponent rebound (same one tap as Skip used to be).
            const theirRebound = () => { if (onOpponentRebound) onOpponentRebound(); startOver(); };
            // NEW: opponent shot from the same court. A make ends the flow; a miss asks if we got the rebound.
            const commitOpponent = (made) => {
                onOpponentCommit(pending.isThree, made, pending.x, pending.y);
                if (made) startOver(); else { setScorerId(null); setStep('oppRebound'); }
            };

            return (
                <div className="shot-panel bg-black/30 rounded-xl p-2 border border-zinc-800">
                    <div className="text-center text-xs font-black uppercase mb-1.5">
                        {step === 'location' && <span className="text-zinc-400"><Icon name="ball" className="mr-1.5" />Tap where the shot was taken</span>}
                        {step === 'location' && firstShot && <div className="text-[11px] font-bold normal-case text-zinc-500 mt-0.5">Works for both teams. Next you pick the shooter or Opponent, then <Icon name="check" /> made or <Icon name="x" /> missed.</div>}
                        {step === 'playerResult' && <span className={pending.isThree ? 'text-blue-400' : 'text-gold'}><Icon name="dot" className="mr-1" />{pending.isThree ? '3PT' : '2PT'} — Who, Made/Miss?</span>}
                        {step === 'assist' && <span className="text-green-400">Basket Made — Who Assisted?</span>}
                        {step === 'rebound' && <span className="text-white">Missed — Who Got The Rebound?</span>}
                        {step === 'oppRebound' && <span className="text-white">They Missed — Did We Get The Rebound?</span>}
                    </div>
                    {step === 'location' && (
                        <div className="court-area"><div className="court-box">
                            <CourtSVG onTap={handleTap} />
                        </div></div>
                    )}
                    {step === 'playerResult' && (
                        <div className="shot-list space-y-1.5 mt-2">
                            {activePlayers.map(p => (
                                <div key={p.id} className="flex items-center gap-2">
                                    <div className="flex-1 min-w-0 bg-zinc-900 rounded-lg px-3 py-3">
                                        <div className="text-base font-black leading-tight truncate">{p.name.split(' ')[0]}</div>
                                        <div className="text-[10px] text-zinc-500 leading-none">#{p.id}</div>
                                    </div>
                                    <button onClick={()=>commit(p, true)} className="bg-make rounded-lg flex items-center justify-center font-black text-white text-lg" style={{width:'56px', height:'56px', flexShrink:0}} aria-label="Made"><Icon name="check" size={28} style={{strokeWidth:3}} /></button>
                                    <button onClick={()=>commit(p, false)} className="bg-miss rounded-lg flex items-center justify-center font-black text-white text-lg" style={{width:'56px', height:'56px', flexShrink:0}} aria-label="Missed"><Icon name="x" size={26} style={{strokeWidth:3}} /></button>
                                </div>
                            ))}
                            {onOpponentCommit && (
                                <div className="flex items-center gap-2 pt-1.5 border-t border-red-900/50">
                                    <div className="flex-1 min-w-0 bg-red-950/60 border border-red-900 rounded-lg px-3 py-2">
                                        <div className="text-base font-black leading-tight text-red-300">Opponent</div>
                                    </div>
                                    <button onClick={()=>commitOpponent(true)} className="bg-make rounded-lg flex items-center justify-center font-black text-white text-lg" style={{width:'56px', height:'56px', flexShrink:0}} aria-label="Made"><Icon name="check" size={28} style={{strokeWidth:3}} /></button>
                                    <button onClick={()=>commitOpponent(false)} className="bg-miss rounded-lg flex items-center justify-center font-black text-white text-lg" style={{width:'56px', height:'56px', flexShrink:0}} aria-label="Missed"><Icon name="x" size={26} style={{strokeWidth:3}} /></button>
                                </div>
                            )}
                        </div>
                    )}
                    {step === 'assist' && (
                        <div className="shot-list grid grid-cols-3 gap-2 mt-2 content-start">
                            {activePlayers.filter(p => p.id !== scorerId).map(p => (
                                <button key={p.id} onClick={()=>finishAssist(p.id)} className="kb-player-btn" style={{minHeight:'64px'}}>
                                    <div className="text-xs font-black leading-none">{p.name.split(' ')[0]}</div>
                                </button>
                            ))}
                            <button onClick={()=>finishAssist(null)} className="kb-player-btn bg-zinc-800"><div className="text-xs font-black leading-none text-zinc-400">No Assist</div></button>
                        </div>
                    )}
                    {step === 'rebound' && (
                        <div className="shot-list grid grid-cols-3 gap-2 mt-2 content-start">
                            {activePlayers.map(p => (
                                <button key={p.id} onClick={()=>finishRebound(p.id)} className="kb-player-btn" style={{minHeight:'64px'}}>
                                    <div className="text-xs font-black leading-none">{p.name.split(' ')[0]}</div>
                                </button>
                            ))}
                            <button onClick={theirRebound} className="kb-player-btn bg-red-950 border-red-900"><div className="text-xs font-black leading-none text-red-300">They got it</div></button>
                        </div>
                    )}
                    {step === 'oppRebound' && (
                        <div className="shot-list grid grid-cols-3 gap-2 mt-2 content-start">
                            {activePlayers.map(p => (
                                <button key={p.id} onClick={()=>finishRebound(p.id)} className="kb-player-btn" style={{minHeight:'64px'}}>
                                    <div className="text-xs font-black leading-none">{p.name.split(' ')[0]}</div>
                                </button>
                            ))}
                            <button onClick={theirRebound} className="kb-player-btn bg-red-950 border-red-900"><div className="text-xs font-black leading-none text-red-300">They got it</div></button>
                        </div>
                    )}
                    {(step === 'rebound' || step === 'oppRebound') && <button onClick={startOver} className="w-full text-center text-xs text-zinc-400 hover:text-white mt-2">No rebound (ball went out)</button>}
                    {step !== 'location' && <button onClick={startOver} className="w-full text-center text-[10px] text-zinc-500 hover:text-white underline mt-1.5"><Icon name="arrowLeft" className="mr-1" />Start Over</button>}
                </div>
            );
        }

        // NEW: opponent version of the shot chart — same tap-the-court flow, skipping the "who shot it"
        // step (no per-player opponent tracking), since the point is seeing WHERE they're getting shots
        // up. If they miss, immediately asks if one of OUR players got the defensive rebound — tap a
        // player, or Skip if they got their own board (which we're intentionally not tracking).
        function OpponentShotChartPanel({ activePlayers, onCommit, onRebound }) {
            const [step, setStep] = React.useState('location');
            const [pending, setPending] = React.useState(null);

            const handleTap = (x, y) => { setPending({ x, y, isThree: isThreePointShot(x, y) }); setStep('result'); };
            const startOver = () => { setStep('location'); setPending(null); };
            const commit = (made) => {
                onCommit(pending.isThree, made, pending.x, pending.y);
                if (made) startOver(); else setStep('rebound');
            };
            const finishRebound = (pid) => { if (pid) onRebound(pid); startOver(); };

            return (
                <div className="bg-black/30 rounded-xl p-2 border border-red-900/30">
                    <div className="text-center text-xs font-black uppercase mb-1.5">
                        {step === 'location' && <span className="text-zinc-400"><Icon name="ball" className="mr-1.5" />Tap Where Opponent Shot</span>}
                        {step === 'result' && <span className={pending.isThree ? 'text-blue-400' : 'text-gold'}>Opp {pending.isThree ? '3PT' : '2PT'} — Made or Missed?</span>}
                        {step === 'rebound' && <span className="text-white">They Missed — Did We Get The Board?</span>}
                    </div>
                    <div style={{maxWidth: 'min(100%, 46vh)', margin: '0 auto'}}>
                        <CourtSVG onTap={step === 'location' ? handleTap : undefined}>
                            {pending && <circle cx={pending.x} cy={pending.y} r="9" fill="#ef4444" stroke="white" strokeWidth="2" />}
                        </CourtSVG>
                    </div>
                    {step === 'result' && (
                        <div className="flex gap-2 mt-2">
                            <button onClick={()=>commit(true)} className="flex-1 kb-stat-btn bg-make" style={{minHeight:'46px'}}>MADE</button>
                            <button onClick={()=>commit(false)} className="flex-1 kb-stat-btn bg-miss" style={{minHeight:'46px'}}>MISSED</button>
                        </div>
                    )}
                    {step === 'rebound' && (
                        <div className="grid grid-cols-3 gap-1.5 mt-2">
                            {activePlayers.map(p => (
                                <button key={p.id} onClick={()=>finishRebound(p.id)} className="kb-player-btn" style={{minHeight:'46px'}}>
                                    <div className="text-xs font-black leading-none">{p.name.split(' ')[0]}</div>
                                </button>
                            ))}
                            <button onClick={()=>finishRebound(null)} className="kb-player-btn bg-zinc-800"><div className="text-xs font-black leading-none text-zinc-400">Skip</div></button>
                        </div>
                    )}
                    {step !== 'location' && <button onClick={startOver} className="w-full text-center text-[10px] text-zinc-500 hover:text-white underline mt-1.5"><Icon name="arrowLeft" className="mr-1" />Start Over</button>}
                </div>
            );
        }

        // NEW: roster editor used inside the "Manage Roster" modal. Lets you switch between Varsity/JV,
        // edit a player's name/number/position inline, remove a player, or add a new one. Every change
        // is written straight to Firestore (via the onAdd/onUpdate/onRemove callbacks from App), so it
        // shows up on every device within a second or two — no app update or code edit needed.
        // ===================================================================================
        // NEW: PLAY BUILDER (coaches only). Plays are saved to Firestore ('plays'). Published
        // plays show up on playbook.html for players. Same court and drawing as the playbook.
        // ===================================================================================
        const PLAY_CATEGORIES = ['Half-court offense', 'Press break', 'Baseline inbounds', 'Sideline inbounds', 'Defense', 'Special situations'];
        const PB_DEFAULT_START = { 1: [250, 320], 2: [80, 245], 3: [420, 245], 4: [178, 88], 5: [322, 88] };
        // NEW: tags for filtering. Suggestions show alongside any tags already used.
        const PB_TAG_SUGGESTIONS = ['Man-to-man', 'Zone', 'Continuity', 'Set play', 'Quick hitter', 'Ball screen', 'Backdoor', 'Handoff', 'End of game'];
        const pbNewPlay = () => ({ name: '', category: PLAY_CATEGORIES[0], tags: [], summary: '', video: '', published: false, start: JSON.parse(JSON.stringify(PB_DEFAULT_START)), ball: 1, steps: [{ say: '', moves: [], notes: {} }] });
        const pbStateAt = (play, k) => {
            const pos = {}; Object.keys(play.start).forEach(p => pos[p] = [...play.start[p]]);
            let ball = play.ball;
            for (let i = 0; i < k; i++) (play.steps[i].moves || []).forEach(m => { if (m.type === 'pass') ball = m.to; else if (m.type === 'shot') ball = null; else pos[m.p] = [...m.to]; });
            return { pos, ball };
        };
        // NEW: shot. An arc from the shooter to the rim (bowed to one side so it reads as a shot).
        const PB_RIM = [250, 62.5];
        const pbShotCurve = (a) => {
